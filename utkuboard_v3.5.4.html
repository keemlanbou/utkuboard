                             <div className="pointer-events-none break-words w-full text-center leading-tight font-bold" style={{ fontSize: (el.fontSize || 18) + 'px', whiteSpace: 'pre-wrap' }}>{el.content}</div>
                           )}
                       </div>
                    </div>
                  )}

                  {/* TEXT (Encapsulated Box) */}
                  {el.type === 'text' && (
                    <div className="w-full h-full flex items-center justify-center rounded-2xl overflow-hidden p-2 group-hover:bg-black/5 dark:group-hover:bg-white/5 transition-colors">
                      {editingId === el.id ? (
                          <textarea autoFocus className="bg-transparent outline-none w-full h-full resize-none font-bold break-words" style={{ fontSize: (el.fontSize || 18) + 'px', color: el.textColor === 'default' ? (isDark ? '#fff' : '#000') : el.textColor, textAlign: el.textAlign || 'center' }} value={el.content} onChange={e => updateElement(el.id, {content: e.target.value})} onMouseDown={e => e.stopPropagation()} onPointerDown={e => e.stopPropagation()} draggable={false} onBlur={() => setEditingId(null)} />
                       ) : (
                          <div className="pointer-events-none font-bold w-full break-words leading-snug" style={{ fontSize: (el.fontSize || 18) + 'px', color: el.textColor === 'default' ? (isDark ? '#fff' : '#000') : el.textColor, textAlign: el.textAlign || 'center', whiteSpace: 'pre-wrap' }}>
                              {el.content ? el.content : <span className="opacity-40 italic">Double click to edit text</span>}
                          </div>
                       )}
                    </div>
                  )}

                  {/* EMOJI */}
                  {el.type === 'emoji' && (
                    <div className="w-full h-full flex items-center justify-center pointer-events-none drop-shadow-md">
                       <div className="flex items-center justify-center text-center w-full h-full" style={{ fontSize: Math.min(el.width, el.height) * 0.7 + 'px' }}>
                        {el.content}
                      </div>
                    </div>
                  )}

                  {/* FREEHAND DRAWING */}
                  {el.type === 'draw' && (
                     <div className="w-full h-full pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" className="w-full h-full overflow-visible">
                           <path 
                              d={`M ${el.points.map(p => `${p.x},${p.y}`).join(' L ')}`} 
                              stroke={el.color} strokeWidth={el.strokeWidth} fill="none" strokeLinecap="round" strokeLinejoin="round" 
                           />
                        </svg>
                     </div>
                  )}

                  {/* IMAGE IMPORT */}
                  {el.type === 'image' && (
                     <div className="w-full h-full rounded-2xl overflow-hidden shadow-sm pointer-events-none" style={{ border: el.strokeColor && el.strokeColor !== 'transparent' ? `${el.strokeWidth || 2}px solid ${el.strokeColor}` : '1px solid rgba(0,0,0,0.1)' }}>
                        <img src={el.content} alt="" className="w-full h-full object-cover" draggable={false} />
                     </div>
                  )}


                  
                  {/* LINK PREVIEW */}
                  {el.type === 'link' && (
                    <div 
                      className="w-full h-full rounded-2xl shadow-xl flex flex-col transition-colors border border-black/10 dark:border-white/10 overflow-hidden group/link" 
                      style={{ backgroundColor: el.color }} 
                      onDoubleClick={(e) => { e.stopPropagation(); openLinkSafely(el.url); }}
                    >
                       <div className={`w-full h-full flex flex-col pointer-events-none ${isDark ? 'bg-[#262320]/50' : 'bg-white/50'}`}>
                          {el.thumbnail ? (
                             <>
                               {el.thumbnail.startsWith('data:image/svg+xml') ? (
                                   <div style={{ height: '144px', width: '100%', borderBottom: '1px solid rgba(0,0,0,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', backgroundColor: '#e2e8f0', flexShrink: 0 }}>
                                       <img src={el.thumbnail} style={{ width: '100%', height: '100%', objectFit: 'cover' }} alt="Map Location" />
                                   </div>
                               ) : (
                                   <div style={{ height: '144px', width: '100%', borderBottom: '1px solid rgba(0,0,0,0.1)', backgroundImage: `url("${el.thumbnail}")`, backgroundSize: 'cover', backgroundPosition: 'center', flexShrink: 0 }}></div>
                               )}
                               <div style={{ height: '96px', width: '100%', display: 'flex', alignItems: 'center', padding: '0 16px', boxSizing: 'border-box', overflow: 'hidden', color: el.textColor === 'default' ? getContrastText(el.color) : el.textColor }}>
                                   <Icon name="external" size={16} style={{ flexShrink: 0, marginRight: '12px' }} />
                                   <div style={{ display: 'flex', flexDirection: 'column', overflow: 'hidden', width: '100%' }}>
                                       <div style={{ fontWeight: 'bold', fontSize: '14px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{el.title || el.domain}</div>
                                       {(el.title && el.title !== el.domain) && <div style={{ fontSize: '10px', opacity: 0.6, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginTop: '4px' }}>{el.domain}</div>}
                                   </div>
                               </div>
                             </>
                          ) : (
                             <div style={{ height: '80px', width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 16px', boxSizing: 'border-box', overflow: 'hidden', color: el.textColor === 'default' ? getContrastText(el.color) : el.textColor }}>
                                 <img crossOrigin="anonymous" src={`https://www.google.com/s2/favicons?domain=${el.domain}&sz=64`} style={{ width: '24px', height: '24px', borderRadius: '6px', flexShrink: 0, marginRight: '12px' }} onError={(e) => e.target.style.display='none'} />
                                 <div style={{ display: 'flex', flexDirection: 'column', overflow: 'hidden', width: '100%' }}>
                                       <div style={{ fontWeight: 'bold', fontSize: '14px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{el.title || el.domain}</div>
                                       {(el.title && el.title !== el.domain) && <div style={{ fontSize: '10px', opacity: 0.6, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginTop: '4px' }}>{el.domain}</div>}
                                 </div>
                                 <Icon name="external" size={16} style={{ marginLeft: 'auto', opacity: 0.5, flexShrink: 0 }} />
                             </div>
                          )}
                       </div>
                    </div>
                  )}

                  {/* TRELLO BOARD / CARDS */}
                  {el.type === 'card' && (
                    <div 
                      className={`w-full h-full rounded-2xl shadow-xl flex flex-col overflow-hidden transition-all group/card`}
                      style={{ backgroundColor: el.color, border: el.strokeColor && el.strokeColor !== 'transparent' ? `${el.strokeWidth || 2}px solid ${el.strokeColor}` : '1px solid rgba(0,0,0,0.1)' }}
                      onDragOver={(e) => {
                        e.preventDefault();
                        // If dragging over the card body (not a specific task), target end
                        if (!taskDropTarget || taskDropTarget.listId !== el.id) {
                          setTaskDropTarget({ listId: el.id, insertIndex: (el.tasks?.length || 0) });
                        }
                      }}
                      onDragLeave={(e) => {
                        // Only clear if actually leaving the card
                        if (!e.currentTarget.contains(e.relatedTarget)) {
                          setTaskDropTarget(prev => prev?.listId === el.id ? null : prev);
                        }
                      }}
                      onDrop={(e) => onListDrop(e, el.id, taskDropTarget?.listId === el.id ? taskDropTarget.insertIndex : (el.tasks?.length || 0))}
                    >
                      <div className={`relative px-5 py-4 font-bold flex justify-between items-center border-b border-black/5 dark:border-white/10 shrink-0`}
                           style={{
                               backgroundImage: el.headerImage ? `url(${el.headerImage})` : 'none',
                               backgroundSize: 'cover', backgroundPosition: 'center'
                           }}>
                        {el.headerImage && <div className="absolute inset-0 bg-black/40"></div>}
                        <div className="relative z-10 w-full flex justify-between items-center">
                            {editingId === `${el.id}-title` ? (
                               <input autoFocus value={el.content || 'Doing'} onChange={(e) => updateElement(el.id, { content: e.target.value })} onMouseDown={e => e.stopPropagation()} onPointerDown={(e) => e.stopPropagation()} draggable={false} onBlur={() => setEditingId(null)} onKeyDown={(e) => { if (e.key === 'Enter') setEditingId(null); }} className={`bg-transparent border-none outline-none w-full text-black`} style={{ color: el.headerImage ? '#ffffff' : (el.textColor === 'default' ? getContrastText(el.color) : el.textColor) }} />
                            ) : (
                               <div className={`w-full font-bold text-lg select-none cursor-grab active:cursor-grabbing`} style={{ color: el.headerImage ? '#ffffff' : (el.textColor === 'default' ? getContrastText(el.color) : el.textColor) }} onDoubleClick={(e) => {e.stopPropagation(); takeSnapshot(); setEditingId(`${el.id}-title`);}}>{el.content || 'Doing'}</div>
                            )}

                            <div className="relative">
                               <button onPointerDown={(e) => { e.stopPropagation(); setCardHeaderMenu(cardHeaderMenu === el.id ? null : el.id); }} className={`opacity-0 group-hover/card:opacity-100 p-1.5 hover:bg-black/20 rounded-md transition ${el.headerImage ? 'text-white' : 'text-gray-400'}`}>
                                  <Icon name="image" size={14} />
                               </button>
                               {cardHeaderMenu === el.id && (
                                  <div className={`absolute right-0 top-full mt-1 w-32 rounded-lg shadow-xl border flex flex-col overflow-hidden z-50 ${isDark ? 'bg-[#262320] border-zinc-700' : 'bg-white border-gray-200'}`} onPointerDown={e => e.stopPropagation()}>
                                     <label className={`cursor-pointer p-2 text-xs font-semibold text-left transition ${isDark ? 'hover:bg-zinc-800 text-white' : 'hover:bg-gray-100 text-black'}`}>
                                        Upload Header
                                        <input type="file" accept="image/*" hidden onChange={handleHeaderUpload(el.id)} />
                                     </label>
                                     <button onClick={() => { takeSnapshot(); updateElement(el.id, {headerImage: null}); setCardHeaderMenu(null); }} className={`p-2 text-xs font-semibold text-left transition text-red-500 hover:bg-red-500/10`}>Remove</button>
                                  </div>
                               )}
                            </div>
                        </div>
                      </div>
                      
                      <div className="flex-1 p-3 flex flex-col gap-1 bg-black/5 dark:bg-black/10 min-h-[50px] relative overflow-hidden">
                        {el.tasks?.map((task, idx) => (
                          <React.Fragment key={task.id}>
                            {/* Drop indicator BEFORE this task */}
                            {taskDropTarget && taskDropTarget.listId === el.id && taskDropTarget.insertIndex === idx && (
                              <div className="task-drop-indicator" />
                            )}
                            <div 
                             draggable={editingId !== task.id}
                             onDragStart={(e) => {
                                 if (editingId === task.id) { e.preventDefault(); return; }
                                 onTaskDragStart(e, el.id, task.id);
                             }}
                             onDragEnd={onTaskDragEnd}
                             onDragOver={(e) => {
                                 e.preventDefault();
                                 e.stopPropagation();
                                 const rect = e.currentTarget.getBoundingClientRect();
                                 const midY = rect.top + rect.height / 2;
                                 const insertIdx = e.clientY < midY ? idx : idx + 1;
                                 onTaskDragOver(e, el.id, insertIdx);
                             }}
                             onPointerDown={(e) => e.stopPropagation()}
                             data-task-id={task.id}
                             className={`task-card group/task relative flex flex-col p-3 rounded-xl shadow-sm border hover:ring-2 hover:ring-indigo-400 hover:shadow-lg ${editingId !== task.id ? 'cursor-grab active:cursor-grabbing' : 'cursor-text'} bg-white/90 border-black/5 box-border ${taskDragData?.taskId === task.id ? 'dragging' : ''}`}
                             style={{ marginBottom: 6 }}
                            >
                               {editingId === task.id ? (
                                  <textarea autoFocus value={task.text} placeholder="New task..." onChange={(e) => { const newTasks = [...el.tasks]; newTasks[idx].text = e.target.value; updateElement(el.id, { tasks: newTasks, height: 'auto' }); }} onKeyDown={e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); setEditingId(null); } }} onMouseDown={e => e.stopPropagation()} onPointerDown={e => e.stopPropagation()} draggable={false} onBlur={() => setEditingId(null)} className="bg-transparent border-none outline-none text-sm w-full font-medium text-gray-800 resize-none" rows={1} style={{ minHeight: 20, height: 'auto', overflow: 'hidden' }} ref={el2 => { if(el2) { el2.style.height = 'auto'; el2.style.height = el2.scrollHeight + 'px'; }}} />
                               ) : (
                                  <div className={`text-sm font-medium ${task.text ? 'text-gray-800' : 'text-gray-400 italic'} select-none`} style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }} onDoubleClick={(e) => {e.stopPropagation(); takeSnapshot(); setEditingId(task.id);}}>{task.text || 'New task...'}</div>
                               )}

                              <button onPointerDown={e => e.stopPropagation()} onClick={() => { takeSnapshot(); setConnections(cs => cs.filter(cn => !((cn.fromId === el.id && cn.fromPort === 'out-' + task.id) || (cn.toId === el.id && cn.toPort === 'out-' + task.id)))); updateElement(el.id, { tasks: el.tasks.filter(t => t.id !== task.id), height: 'auto' }) }} className="absolute top-1/2 -translate-y-1/2 right-2 text-gray-400 hover:text-red-500 opacity-0 group-hover/task:opacity-100 transition-opacity"><Icon name="close" size={14} /></button>
                            </div>
                          </React.Fragment>
                        ))}
                        {/* Drop indicator AFTER last task */}
                        {taskDropTarget && taskDropTarget.listId === el.id && taskDropTarget.insertIndex === (el.tasks?.length || 0) && (
                          <div className="task-drop-indicator" />
                        )}
                      </div>

                      {/* Add Card Button Section */}
                      <div className="p-3 pt-2 bg-black/5 dark:bg-black/10 shrink-0">
                         <button 
                           onPointerDown={e => e.stopPropagation()} 
                           onClick={() => {
                              takeSnapshot();
                              const newTaskId = generateId();
                              updateElement(el.id, { tasks: [...(el.tasks || []), { id: newTaskId, text: '' }], height: 'auto' });
                              setEditingId(newTaskId);
                           }} 
                           className={`w-full py-2 rounded-xl text-sm font-semibold flex items-center justify-start px-2 gap-2 transition hover:bg-black/10`}
                           style={{ color: el.textColor === 'default' ? getContrastText(el.color) : el.textColor }}
                         >
                           <Icon name="plus" size={16} /> Add a card
                         </button>
                      </div>

                    </div>
                  )}

                </div>
                );
              })}
            </div>

            {/* Selection Box Render */}
            {selectionBox && (
              <div 
                className={`absolute z-50 pointer-events-none ${selectionBox.currentX >= selectionBox.startX ? 'border border-indigo-500 bg-indigo-500/10' : 'border border-dashed border-green-500 bg-green-500/15'}`}
                style={{
                  left: Math.min(selectionBox.startX, selectionBox.currentX),
                  top: Math.min(selectionBox.startY, selectionBox.currentY),
                  width: Math.abs(selectionBox.currentX - selectionBox.startX),
                  height: Math.abs(selectionBox.currentY - selectionBox.startY),
                }}
              />
            )}
          </div>
        </div>
        
        {/* Minimap */}
        {elements.length > 0 && (
          (() => {
            const bounds = getContentBounds(elements, frames);
            if (!bounds) return null;

            const mmW = 160;
            const mmH = 100;
            const contentScale = Math.min(mmW / bounds.width, mmH / bounds.height) * 0.85;
            const offsetX = (mmW - bounds.width * contentScale) / 2;
            const offsetY = (mmH - bounds.height * contentScale) / 2;

            const workspace = workspaceRef.current;
            const rect = workspace ? workspace.getBoundingClientRect() : { width: 1000, height: 600 };
            const vpLeft = ((-transform.x) / transform.scale - bounds.x) * contentScale + offsetX;
            const vpTop = ((-transform.y) / transform.scale - bounds.y) * contentScale + offsetY;
            const vpW = (rect.width / transform.scale) * contentScale;
            const vpH = (rect.height / transform.scale) * contentScale;

            return (
              <div
                data-html2canvas-ignore="true"
                className={`absolute bottom-8 right-4 z-40 rounded-lg shadow-xl border overflow-hidden cursor-crosshair ui-element ${isDark ? 'bg-[#262320] border-zinc-700' : 'bg-white border-gray-300'}`}
                style={{ width: mmW, height: mmH }}
                onClick={(e) => {
                  const mmRect = e.currentTarget.getBoundingClientRect();
                  const clickX = e.clientX - mmRect.left;
                  const clickY = e.clientY - mmRect.top;
                  const worldX = ((clickX - offsetX) / contentScale) + bounds.x;
                  const worldY = ((clickY - offsetY) / contentScale) + bounds.y;
                  setTransform({
                    x: -(worldX * transform.scale) + rect.width / 2,
                    y: -(worldY * transform.scale) + rect.height / 2,
                    scale: transform.scale
                  });
                }}
              >
                <svg width={mmW} height={mmH} xmlns="http://www.w3.org/2000/svg">
                  {elements.map(el => {
                    if (el.type === 'arrow') {
                        const sX = el.startX !== undefined ? el.startX : el.x + (el.relStartX || 0);
                        const sY = el.startY !== undefined ? el.startY : el.y + (el.relStartY || 0);
                        const eX = el.endX !== undefined ? el.endX : el.x + (el.relEndX || 0);
                        const eY = el.endY !== undefined ? el.endY : el.y + (el.relEndY || 0);
                        return <line key={el.id} x1={(sX - bounds.x) * contentScale + offsetX} y1={(sY - bounds.y) * contentScale + offsetY} x2={(eX - bounds.x) * contentScale + offsetX} y2={(eY - bounds.y) * contentScale + offsetY} stroke="#e07a5f" strokeWidth={1} />;
                    }
                    const w = el.width === 'auto' ? 280 : el.width;
                    const h = el.height === 'auto' ? 100 : el.height;
                    const rx = (el.x - bounds.x) * contentScale + offsetX;
                    const ry = (el.y - bounds.y) * contentScale + offsetY;
                    const rw = w * contentScale;
                    const rh = h * contentScale;
                    const fill = el.type === 'card' ? '#e07a5f' : el.type === 'text' ? '#a78bfa' : el.type === 'arrow' ? 'none' : (el.color || '#888');
                    const stroke = el.type === 'arrow' ? '#e07a5f' : 'none';
                    if (el.type === 'circle') return <ellipse key={el.id} cx={rx + rw/2} cy={ry + rh/2} rx={rw/2} ry={rh/2} fill={fill} opacity={0.7} />;
                    return <rect key={el.id} x={rx} y={ry} width={Math.max(rw, 2)} height={Math.max(rh, 2)} rx={1} fill={fill} stroke={stroke} strokeWidth={1} opacity={0.7} />;
                  })}
                  {frames.map(f => {
                    const rx = (f.x - bounds.x) * contentScale + offsetX;
                    const ry = (f.y - bounds.y) * contentScale + offsetY;
                    return <rect key={f.id} x={rx} y={ry} width={f.width * contentScale} height={f.height * contentScale} rx={2} fill="none" stroke={isDark ? '#555' : '#999'} strokeWidth={1} opacity={0.5} />;
                  })}
                  <rect x={vpLeft} y={vpTop} width={vpW} height={vpH} fill="none" stroke="#e07a5f" strokeWidth={1.5} rx={1} opacity={0.8} />
                </svg>
              </div>
            );
          })()
        )}

        {/* Signature Watermark */}
        <div data-html2canvas-ignore="true" className="absolute bottom-7 right-6 text-[10px] font-medium opacity-30 pointer-events-none select-none z-30 tracking-wide">
          Made by AI+Utku
        </div>

        {/* Search Bar */}
        {showSearch && (
          <div data-html2canvas-ignore="true" className={`absolute top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 p-2 rounded-xl shadow-2xl border backdrop-blur-md ui-element ${isDark ? 'bg-[#262320]/95 border-zinc-700' : 'bg-white/95 border-gray-200'}`}>
            <Icon name="cursor" size={14} className="opacity-40" />
            <input
              autoFocus
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Escape') { setShowSearch(false); setSearchQuery(''); }
                if (e.key === 'Enter' && searchMatches.length > 0) {
                  const firstMatch = elements.find(el => el.id === searchMatches[0]);
                  if (firstMatch) {
                    const w = firstMatch.width === 'auto' ? 280 : firstMatch.width;
                    const rect = workspaceRef.current.getBoundingClientRect();
                    setTransform({
                      x: (rect.width / 2) - ((firstMatch.x + w/2) * transform.scale),
                      y: (rect.height / 2) - ((firstMatch.y + 50) * transform.scale),
                      scale: transform.scale
                    });
                    setSelectedIds(new Set([firstMatch.id]));
                  }
                }
              }}
              placeholder="Search elements..."
              className={`bg-transparent outline-none text-sm w-48 ${isDark ? 'text-white placeholder-zinc-500' : 'text-black placeholder-gray-400'}`}
            />
            <span className={`text-[10px] font-medium ${searchMatches.length > 0 ? 'text-green-500' : 'opacity-40'}`}>
              {searchQuery.trim() ? `${searchMatches.length} found` : ''}
            </span>
            <button onClick={() => { setShowSearch(false); setSearchQuery(''); }} className="p-0.5 hover:bg-black/10 dark:hover:bg-white/10 rounded">
              <Icon name="close" size={12} />
            </button>
          </div>
        )}

        {/* Footers / Helpers */}
        {/* Hint text removed — help button covers all shortcuts */}

        <div data-html2canvas-ignore="true" className={`absolute bottom-0 w-full flex items-center px-4 text-[9px] font-mono z-40 border-t ui-element ${isDark ? 'bg-[#262320] border-zinc-800' : 'bg-white border-gray-300'}`} style={{ height: 'calc(20px + var(--sab, 0px))', paddingBottom: 'var(--sab, 0px)' }}>
          <div className="flex-1 flex items-center gap-3">
            <span className="opacity-70">{elements.length} elements · {frames.length} frames · {connections.length} connections</span>
          <span className="ml-auto opacity-40">v{APP_VERSION}</span>
            <span className="opacity-50">|</span>
            <span>Mem</span>
            <div className="flex-1 max-w-[120px] h-1 bg-black/10 dark:bg-white/10 rounded-full overflow-hidden flex items-center">
              <div className="h-full transition-all duration-500 ease-out" style={{ width: `${sizePercentage}%`, backgroundColor: getBarColor(sizePercentage) }} />
            </div>
            <span>{(approxSize / 1024).toFixed(1)} KB</span>
            {selectedIds.size > 0 && <><span className="opacity-50">|</span><span className="text-indigo-400">{selectedIds.size} selected</span></>}
          </div>
        </div>
      </div>
    </div>
  );
}

// Render the application to the DOM
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
