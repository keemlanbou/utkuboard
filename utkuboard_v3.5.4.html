  if (!hexcolor || hexcolor === 'transparent' || hexcolor.startsWith('rgba')) return '#000000';

const generateId = () => Math.random().toString(36).substr(2, 9);

// Segment intersection (for the connection knife)
const segIntersect = (a, b, p, q) => {
  const ccw = (r, s, t) => (t.y - r.y) * (s.x - r.x) > (s.y - r.y) * (t.x - r.x);
  return ccw(a, p, q) !== ccw(b, p, q) && ccw(a, b, p) !== ccw(a, b, q);
};

// Safely open external links — only http(s), with noopener/noreferrer to prevent tabnabbing
const openLinkSafely = (url) => {
  if (!url || typeof url !== 'string') return;
  let safe = url.trim();
  // Allow only http:// and https:// — block javascript:, data:, file:, etc.
  if (!/^https?:\/\//i.test(safe)) {
    // If it looks like a domain without protocol, prepend https://
    if (/^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(safe)) safe = 'https://' + safe;
    else { alert('Only http and https links can be opened.'); return; }
  }
  window.open(safe, '_blank', 'noopener,noreferrer');
};

// Remembers which file each project was opened from / saved to (Chrome/Edge File System Access).
// Handles live in IndexedDB so "Save" keeps writing to the same file, even after reopening.
const HandleStore = (() => {
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('utkuboard_handles', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('handles');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('handles', mode);
      const req = fn(t.objectStore('handles'));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get: (id) => run('readonly', s => s.get(id)).catch(() => null),
    set: (id, h) => run('readwrite', s => s.put(h, id)).catch(() => {}),
  };
})();

// Remove connections attached to deleted nodes. Deleted reroute nodes "heal":
// every wire coming in is reconnected to every wire going out (UE-style).
const pruneConnections = (cs, deletedIds, els) => {
  let next = cs;
  els.filter(el => el.type === 'reroute' && deletedIds.has(el.id)).forEach(r => {
    const ins = next.filter(c => c.toId === r.id && c.fromId !== r.id);
    const outs = next.filter(c => c.fromId === r.id && c.toId !== r.id);
    const rest = next.filter(c => c.toId !== r.id && c.fromId !== r.id);
    const bridged = [];
    ins.forEach(i => outs.forEach(o => {
      if (i.fromId === o.toId) return;
      const dup = [...rest, ...bridged].some(c =>
        (c.fromId === i.fromId && c.fromPort === i.fromPort && c.toId === o.toId && c.toPort === o.toPort) ||
        (c.fromId === o.toId && c.fromPort === o.toPort && c.toId === i.fromId && c.toPort === i.fromPort));
      if (!dup) bridged.push({ ...o, id: generateId(), fromId: i.fromId, fromPort: i.fromPort });
    }));
    next = [...rest, ...bridged];
  });
  return next.filter(c => !deletedIds.has(c.fromId) && !deletedIds.has(c.toId));
};
const MAX_FILE_SIZE = 2 * 1024 * 1024 * 1024; // 2GB

const getExactHeight = (node) => {
    if (node.height !== 'auto') return node.height;
    if (node.type === 'card') {
        const taskCount = node.tasks?.length || 0;
        const taskHeight = (node.tasks || []).reduce((sum, t) => {
            const lines = Math.max(1, Math.ceil((t.text || '').length / 30));
            return sum + 28 + (lines - 1) * 18;
        }, 0);
        return taskCount > 0 ? 131 + taskHeight + (taskCount * 12) : 167;
    }
    return 100;
};

// Task output ports rendered on the CARD FRAME (not inside draggable rows).
// Positions measured via offsetTop chain — immune to canvas zoom and CSS transforms.
const CardTaskPorts = ({ el, connectingStart, hoveredPort, setHoveredPort, startConnection, completeConnection }) => {
  const [tops, setTops] = React.useState([]);
  React.useLayoutEffect(() => {
    const cardEl = document.querySelector('[data-element-id="' + el.id + '"]');
    if (!cardEl) return;
    const next = (el.tasks || []).map(t => {
      const te = cardEl.querySelector('[data-task-id="' + t.id + '"]');
      if (!te) return null;
      let y = 0, n = te;
      while (n && n !== cardEl) { y += n.offsetTop; n = n.offsetParent; }
      return { id: t.id, top: y + te.offsetHeight / 2 };
    }).filter(Boolean);
    setTops(next);
  }, [el.tasks, el.content, el.headerImage, el.width, el.id]);

  return (<>
    {tops.map(p => (
      <div key={'tp-' + p.id}
        onPointerDown={startConnection(el.id, 'out-' + p.id)}
        onPointerUp={completeConnection(el.id, 'out-' + p.id)}
        onPointerEnter={() => setHoveredPort({ nodeId: el.id, port: 'out-' + p.id })}
        onPointerLeave={() => setHoveredPort(null)}
        className={`absolute w-4 h-4 rounded-full border-2 border-white bg-indigo-500 z-50 cursor-crosshair transition-all ${hoveredPort?.nodeId === el.id && hoveredPort?.port === 'out-' + p.id ? 'scale-125 bg-indigo-400 opacity-100' : connectingStart ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}
        style={{ right: -8, top: p.top - 8 }}
      />
    ))}
  </>);
};

// Read actual DOM height for auto-height elements (cards, text)
const getDOMHeight = (nodeId, fallbackH) => {
    const domEl = document.querySelector('[data-element-id="' + nodeId + '"], [data-frame-id="' + nodeId + '"]');
    return domEl ? domEl.offsetHeight : fallbackH;
};

const getContentBounds = (elements, frames) => {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

  elements.forEach(el => {
    if (el.type === 'arrow') {
      const sX = el.startX !== undefined ? el.startX : el.x + (el.relStartX || 0);
      const sY = el.startY !== undefined ? el.startY : el.y + (el.relStartY || 0);
      const eX = el.endX !== undefined ? el.endX : el.x + (el.relEndX || 0);
      const eY = el.endY !== undefined ? el.endY : el.y + (el.relEndY || 0);
      if (sX < minX) minX = sX;
      if (sY < minY) minY = sY;
      if (eX < minX) minX = eX;
      if (eY < minY) minY = eY;
      if (sX > maxX) maxX = sX;
      if (sY > maxY) maxY = sY;
      if (eX > maxX) maxX = eX;
      if (eY > maxY) maxY = eY;
      return;
    }

    const w = el.width === 'auto' ? 280 : el.width;
    const h = getExactHeight(el);
    if (el.x < minX) minX = el.x;
    if (el.y < minY) minY = el.y;
    if (el.x + w > maxX) maxX = el.x + w;
    if (el.y + h > maxY) maxY = el.y + h;
  });

  frames.forEach(f => {
    if (f.x < minX) minX = f.x;
    if (f.y < minY) minY = f.y;
    if (f.x + f.width > maxX) maxX = f.x + f.width;
    if (f.y + f.height > maxY) maxY = f.y + f.height;
  });

  if (minX === Infinity) return null;

  const pad = 60;
  return {
    x: minX - pad,
    y: minY - pad,
    width: (maxX - minX) + pad * 2,
    height: (maxY - minY) + pad * 2
  };
};

    setActiveProject(parsed);

    if (window.showOpenFilePicker) { openWithHandle(); return; }

      const file = e.target.files[0];

      const reader = new FileReader();
      reader.onload = (event) => {
        let parsed;
        try { parsed = JSON.parse(event.target.result); } catch(err) { alert("Invalid project file."); return; }

        saveToDashboard(parsed);
        setActiveProject(parsed);
        setView('editor');
      };
      reader.readAsText(file);

  useEffect(() => {

      try { setProjects(JSON.parse(saved)); }
      catch(e) { console.warn('Corrupted dashboard data, starting fresh'); }
    }
  }, []);

  useEffect(() => {
    if (theme === 'dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [theme]);

  const saveToDashboard = (project) => {
    const isEmpty = (!project.elements || project.elements.length === 0) && 
                    (!project.connections || project.connections.length === 0) && 
                    (!project.frames || project.frames.length === 0);
    
    let updated;
    if (isEmpty) {
        updated = projects.filter(p => p.id !== project.id);
    } else {
        updated = [...projects.filter(p => p.id !== project.id), { ...project, lastModified: Date.now() }];
    }
    
    setProjects(updated);
    
    try {
      localStorage.setItem('utkuboard_projects', JSON.stringify(updated));
    } catch(e) {
      // localStorage quota exceeded — save a lightweight stub instead
      // so the dashboard still shows the project with correct metadata
      const stub = {
        id: project.id,
        name: project.name,
        lastModified: Date.now(),
        elementCount: (project.elements || []).length,
        connectionCount: (project.connections || []).length,
        frameCount: (project.frames || []).length,
        storedExternally: true,  // flag: full data is only on PC
        elements: [],
        connections: [],
        frames: []
      };
      const stubUpdated = [...projects.filter(p => p.id !== project.id), stub];
      setProjects(stubUpdated);
      try { localStorage.setItem('utkuboard_projects', JSON.stringify(stubUpdated)); } catch(e2) { /* truly full */ }
    }

    };
    setActiveProject(newProj);
    setView('editor');

        return;

      if (!parsed.id || !parsed.elements) {
        alert("Invalid project file — missing required data.");

            >

                <Icon name="plus" size={24} />

              </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  return (
    <Editor 
      initialProject={activeProject} 
      theme={theme} 
      setTheme={setTheme}
      onClose={() => setView('dashboard')}
      onSave={(proj) => saveToDashboard(proj)}
    />
  );

      try { setApproxSize(new Blob([JSON.stringify({ elements, connections, frames })]).size); } catch(e) {}
    }, 1500);
    return () => clearTimeout(t);
  }, [elements, connections, frames]);
  const sizePercentage = Math.min((approxSize / MAX_FILE_SIZE) * 100, 100);
  const getBarColor = (pct) => pct < 50 ? `hsl(${120 - (pct * 1.2)}, 100%, 45%)` : `hsl(${60 - ((pct - 50) * 1.2)}, 100%, 45%)`;

  // Memory Monitor
  useEffect(() => {
    if (approxSize > 4.8 * 1024 * 1024 && !project.acknowledgedStorageLimit && !warningDismissedPermanently) {
      setShowStorageWarning(true);
    } else if (approxSize <= 4.8 * 1024 * 1024) {
      setShowStorageWarning(false);
    }
  }, [approxSize, project.acknowledgedStorageLimit, warningDismissedPermanently]);

  // Track unsaved changes
  useEffect(() => {
    if (isInitialMount.current) {
      isInitialMount.current = false;
      return;
    }
    setIsUnsaved(true);
  }, [elements, connections, frames, project.name]);

  // Auto-save to localStorage every 30 seconds
  useEffect(() => {
    const autoSaveInterval = setInterval(() => {
      if (elements.length > 0 || connections.length > 0 || frames.length > 0) {
        // Skip the heavy serialize+localStorage path for projects beyond quota
        // (it would throw anyway). Manual save still creates the dashboard stub.
        if (approxSize > 4.5 * 1024 * 1024) return;
        const projData = { ...project, elements, connections, frames, lastModified: Date.now(), appVersion: APP_VERSION };
        try { onSave(projData); } catch(e) { /* localStorage full — silent fail, user has the PC save */ }
        setLastSaved(new Date().toLocaleTimeString(undefined, { hour12: false, hour: '2-digit', minute: '2-digit' }));
      }
    }, 30000);
    return () => clearInterval(autoSaveInterval);
  }, [elements, connections, frames, project, approxSize]);

  // Live Time and Date Hook (uses user's local timezone automatically)
  useEffect(() => {
    const updateTime = () => {
      const now = new Date();
      setTimeInfo({ 
        time: now.toLocaleTimeString(undefined, { hour12: false, hour: '2-digit', minute: '2-digit' }), 
        date: now.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric' }) 
      });
    };
    updateTime();
    const timer = setInterval(updateTime, 60000);
    return () => clearInterval(timer);
  }, []);

  // Live Weather Hook (geolocation → Berlin fallback)
  useEffect(() => {
    const fetchWeather = (lat, lon) => {
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
        .then(res => res.json())
        .then(data => {
          const cw = data.current_weather;
          setWeather({ temp: Math.round(cw.temperature), code: cw.weathercode });
        })
        .catch(() => {});
    };
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
        () => fetchWeather(52.52, 13.41) // fallback: Berlin
      );
    } else {
      fetchWeather(52.52, 13.41);
    }
  }, []);

  const searchMatches = searchQuery.trim() ? elements.filter(el => {
    const q = searchQuery.toLowerCase();
    if (el.content && el.content.toLowerCase().includes(q)) return true;
    if (el.tasks && el.tasks.some(t => t.text.toLowerCase().includes(q))) return true;
    if (el.title && el.title.toLowerCase().includes(q)) return true;
    return false;
  }).map(el => el.id) : [];

  // Warn user before closing browser tab if unsaved
  useEffect(() => {
    const handleBeforeUnload = (e) => {
        if (isUnsaved) {
            e.preventDefault();
            e.returnValue = "You have unsaved changes. Are you sure you want to leave?";
            return e.returnValue;
        }
    };
    window.addEventListener('beforeunload', handleBeforeUnload);
    return () => window.removeEventListener('beforeunload', handleBeforeUnload);
  }, [isUnsaved]);

  // Native Wheel Event Listener for pure Zoom without scroll
  useEffect(() => {
    const el = workspaceRef.current;
    if (!el) return;

    const ZOOM_LEVELS = [0.2, 0.35, 0.5, 0.65, 0.8, 1.0];

    const handleNativeWheel = (e) => {
        e.preventDefault();

        wheelAccumulator.current += e.deltaY;
        
        if (Math.abs(wheelAccumulator.current) > 30) {
            const direction = Math.sign(wheelAccumulator.current); 
            wheelAccumulator.current = 0; 

            setTransform(t => {
                let currentIdx = ZOOM_LEVELS.indexOf(t.scale);
                if (currentIdx === -1) {
                    currentIdx = ZOOM_LEVELS.reduce((prev, curr, i) => Math.abs(curr - t.scale) < Math.abs(ZOOM_LEVELS[prev] - t.scale) ? i : prev, 0);
                }
                
                let nextIdx = currentIdx - direction;
                nextIdx = Math.max(0, Math.min(nextIdx, ZOOM_LEVELS.length - 1));
                const newScale = ZOOM_LEVELS[nextIdx];

                if (newScale === t.scale) return t;

                const rect = el.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                const newX = mouseX - (mouseX - t.x) * (newScale / t.scale);
                const newY = mouseY - (mouseY - t.y) * (newScale / t.scale);
                
                return { x: newX, y: newY, scale: newScale };
            });
        }
    };

    el.addEventListener('wheel', handleNativeWheel, { passive: false });
    return () => el.removeEventListener('wheel', handleNativeWheel);
  }, []);

  // --- TOUCH GESTURE SYSTEM (pinch-to-zoom, two-finger pan, long-press) ---
  useEffect(() => {
    const el = workspaceRef.current;
    if (!el) return;

    const getDist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const getMid = (t) => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });

    const handleTouchStart = (e) => {
      // Two fingers → start pinch/pan
      if (e.touches.length === 2) {
        e.preventDefault();
        isPinching.current = true;
        isTouchPanning.current = true;
        const dist = getDist(e.touches);
        const mid = getMid(e.touches);
        const t = transformRef.current;
        pinchStartRef.current = { dist, midX: mid.x, midY: mid.y, startScale: t.scale, startX: t.x, startY: t.y };
        // Cancel any long press
        if (longPressTimer.current) { clearTimeout(longPressTimer.current); longPressTimer.current = null; }
        return;
      }
      
      // Single finger — track for long press detection
      if (e.touches.length === 1) {
        touchStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, timestamp: Date.now() };
        
        // Long press timer (500ms) — context menu on selected elements
        longPressTimer.current = setTimeout(() => {
          if (!touchStartRef.current) return;
          const touch = e.touches[0];
          // Check if touch is over a selected element
          const touchTarget = document.elementFromPoint(touch.clientX, touch.clientY);
          if (touchTarget) {
            const elDiv = touchTarget.closest('[data-element-id]');
            const frDiv = touchTarget.closest('[data-frame-id]');
            const itemId = elDiv?.getAttribute('data-element-id') || frDiv?.getAttribute('data-frame-id');
            if (itemId && selectedIds.has(itemId)) {
              setRightClickMenu({ x: touch.clientX, y: touch.clientY });
              // Vibrate feedback if available
              if (navigator.vibrate) navigator.vibrate(20);
            }
          }
          longPressTimer.current = null;
        }, 500);
      }
    };

    const handleTouchMove = (e) => {
      // Cancel long press on any movement
      if (longPressTimer.current) {
        if (touchStartRef.current) {
          const dx = Math.abs(e.touches[0].clientX - touchStartRef.current.x);
          const dy = Math.abs(e.touches[0].clientY - touchStartRef.current.y);
          if (dx > 8 || dy > 8) {
            clearTimeout(longPressTimer.current);
            longPressTimer.current = null;
          }
        }
      }

      // Two-finger pinch + pan
      if (e.touches.length === 2 && pinchStartRef.current) {
        e.preventDefault();
        const dist = getDist(e.touches);
        const mid = getMid(e.touches);
        const p = pinchStartRef.current;
        const t = transformRef.current;

        // Calculate new scale from pinch
        const ZOOM_LEVELS = [0.2, 0.35, 0.5, 0.65, 0.8, 1.0];
        const rawScale = p.startScale * (dist / p.dist);
        // Snap to nearest zoom level
        let bestScale = ZOOM_LEVELS[0];
        for (const level of ZOOM_LEVELS) {
          if (Math.abs(level - rawScale) < Math.abs(bestScale - rawScale)) bestScale = level;
        }

        // Pan offset from finger midpoint movement
        const panDx = mid.x - p.midX;
        const panDy = mid.y - p.midY;

        // Zoom toward pinch center
        const rect = el.getBoundingClientRect();
        const mx = p.midX - rect.left;
        const my = p.midY - rect.top;
        const newX = mx - (mx - p.startX) * (bestScale / p.startScale) + panDx;
        const newY = my - (my - p.startY) * (bestScale / p.startScale) + panDy;

        t.x = newX;
        t.y = newY;
        t.scale = bestScale;

        if (!rafId.current) {
          rafId.current = requestAnimationFrame(() => {
            const tl = document.getElementById('transform-layer');
            const bg = document.getElementById('workspace-bg');
            if (tl) tl.style.transform = `translate(${t.x}px, ${t.y}px) scale(${t.scale})`;
            if (bg) {
              bg.style.backgroundSize = `${30 * t.scale}px ${30 * t.scale}px`;
              bg.style.backgroundPosition = `${t.x}px ${t.y}px`;
            }
            rafId.current = null;
          });
        }
      }
    };

    const handleTouchEnd = (e) => {
      if (longPressTimer.current) { clearTimeout(longPressTimer.current); longPressTimer.current = null; }
      
      if (isPinching.current || isTouchPanning.current) {
        // Sync back to React state
        const t = transformRef.current;
        setTransform({ x: t.x, y: t.y, scale: t.scale });
        isPinching.current = false;
        isTouchPanning.current = false;
        pinchStartRef.current = null;
        if (rafId.current) { cancelAnimationFrame(rafId.current); rafId.current = null; }
      }
      touchStartRef.current = null;
    };

    el.addEventListener('touchstart', handleTouchStart, { passive: false });
    el.addEventListener('touchmove', handleTouchMove, { passive: false });
    el.addEventListener('touchend', handleTouchEnd, { passive: false });
    el.addEventListener('touchcancel', handleTouchEnd, { passive: false });
    return () => {
      el.removeEventListener('touchstart', handleTouchStart);
      el.removeEventListener('touchmove', handleTouchMove);
      el.removeEventListener('touchend', handleTouchEnd);
      el.removeEventListener('touchcancel', handleTouchEnd);
    };
  }, [selectedIds]);

  // --- CLIPBOARD (copy / cut / paste) ---
  // Board items go to the system clipboard in their own format (CLIP_MIME), so a paste
  // always does exactly ONE thing: board items, OR an external image / link / text.
  const isTypingInField = () => {
    const a = document.activeElement;
    return !!a && (['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) || a.isContentEditable);
  };

  const buildClipboardPayload = () => {
    const { selectedIds, elements, frames, connections } = liveRef.current;
    if (!selectedIds || selectedIds.size === 0) return null;
    const els = elements.filter(el => selectedIds.has(el.id));
    const frs = frames.filter(f => selectedIds.has(f.id));
    if (els.length === 0 && frs.length === 0) return null;
    const ids = new Set([...els.map(el => el.id), ...frs.map(f => f.id)]);
    const conns = connections.filter(c => ids.has(c.fromId) && ids.has(c.toId));
    const text = els.map(el => {
      if (el.type === 'card') return [el.content, ...(el.tasks || []).map(t => '- ' + (t.text || ''))].filter(Boolean).join('\n');
      if (el.type === 'link') return el.url || '';
      if (el.type === 'image' || el.type === 'reroute') return '';
      return typeof el.content === 'string' ? el.content : '';
    }).filter(Boolean).join('\n\n');
    return {
      utkuboard: 1, token: generateId(), projectId: project.id,
      elements: els, frames: frs, connections: conns,
      clipText: text || `Utku Board selection (${ids.size} item${ids.size > 1 ? 's' : ''})`,
      pasteCount: 0
    };
  };

  const deleteSelection = () => {
    const { selectedIds, elements } = liveRef.current;
    if (!selectedIds || selectedIds.size === 0) return;
    const ids = new Set(selectedIds);
    takeSnapshot();
    setElements(els => els.filter(el => !ids.has(el.id)));
    setFrames(fs => fs.filter(f => !ids.has(f.id)));
    setConnections(cs => pruneConnections(cs, ids, elements));
    setSelectedIds(new Set());
  };

  // Paste board items (from this board, another board, or another tab)
  const pasteBoardData = (data) => {
    if (!data || (!(data.elements || []).length && !(data.frames || []).length)) return;
    const ref = clipboardRef.current;
    let dx, dy;
    if (ref && data === ref && data.projectId === project.id) {
      // Same board: cascade each paste 30px further
      ref.pasteCount = (ref.pasteCount || 0) + 1;
      dx = dy = 30 * ref.pasteCount;
    } else {
      // Other board: drop it in the middle of the current view
      const b = getContentBounds(data.elements || [], data.frames || []);
      const rect = workspaceRef.current.getBoundingClientRect();
      const t = transformRef.current;
      const cx = (-t.x + rect.width / 2) / t.scale, cy = (-t.y + rect.height / 2) / t.scale;
      dx = b ? cx - (b.x + b.width / 2) : 0;
      dy = b ? cy - (b.y + b.height / 2) : 0;
    }
    takeSnapshot();
    const idMap = {}, taskMap = {}, groupMap = {};
    const mapGroup = (g) => g ? (groupMap[g] || (groupMap[g] = generateId())) : g;
    const newEls = (data.elements || []).map(el => {
      const c = JSON.parse(JSON.stringify(el));
      c.id = generateId(); idMap[el.id] = c.id;
      if (c.type === 'arrow') {
        c.startX += dx; c.startY += dy; c.endX += dx; c.endY += dy;
      } else { c.x += dx; c.y += dy; }
      if (c.tasks) c.tasks.forEach(t => { const nid = generateId(); taskMap[t.id] = nid; t.id = nid; });
      c.groupId = mapGroup(c.groupId);
      return c;
    });
    const newFrames = (data.frames || []).map(f => {
      const c = JSON.parse(JSON.stringify(f));
      c.id = generateId(); idMap[f.id] = c.id;
      c.x += dx; c.y += dy;
      c.groupId = mapGroup(c.groupId);
      return c;
    });
    const mapPort = (p) => (p && p.startsWith && p.startsWith('out-') && taskMap[p.slice(4)]) ? 'out-' + taskMap[p.slice(4)] : p;
    const newConns = (data.connections || []).filter(c => idMap[c.fromId] && idMap[c.toId]).map(c => ({
      ...c, id: generateId(), fromId: idMap[c.fromId], toId: idMap[c.toId], fromPort: mapPort(c.fromPort), toPort: mapPort(c.toPort)
    }));
    setElements(els => [...els, ...newEls]);
    setFrames(fs => [...fs, ...newFrames]);
    if (newConns.length) setConnections(cs => [...cs, ...newConns]);
    setSelectedIds(new Set([...newEls.map(e => e.id), ...newFrames.map(f => f.id)]));
  };

  // Native copy / cut events (Ctrl+C, Ctrl+X, Edit menu)
  useEffect(() => {
    const handleCopy = (e) => {
      if (isTypingInField()) return;
      const p = buildClipboardPayload();
      if (!p) return;
      copyFiredRef.current = true;
      if (e.type === 'cut') p.pasteCount = -1; // first paste after a cut lands in the original spot
      clipboardRef.current = p;
      try {
        e.clipboardData.setData('text/plain', p.clipText);
        const json = JSON.stringify({ utkuboard: 1, token: p.token, projectId: p.projectId, elements: p.elements, frames: p.frames, connections: p.connections });
        if (json.length < 25 * 1024 * 1024) e.clipboardData.setData(CLIP_MIME, json);
        e.preventDefault();
      } catch (err) {}
      if (e.type === 'cut') deleteSelection();
    };
    document.addEventListener('copy', handleCopy);
    document.addEventListener('cut', handleCopy);
    return () => { document.removeEventListener('copy', handleCopy); document.removeEventListener('cut', handleCopy); };
  });

  // Paste Listener: board items, images, links and plain text
  useEffect(() => {
    const handlePaste = async (e) => {
      pasteFiredRef.current = true;
      if (isTypingInField()) return;
      const cd = e.clipboardData;

      // 0. Board items copied in Utku Board (this board, another board or another tab)
      let custom = '';
      try { custom = cd ? cd.getData(CLIP_MIME) : ''; } catch (err) {}
      if (custom) {
        try {
          const data = JSON.parse(custom);
          if (data && data.utkuboard) {
            e.preventDefault();
            const ref = clipboardRef.current;
            pasteBoardData(ref && ref.token === data.token ? ref : data);
            return;
          }
        } catch (err) {}
      }
      const hasImage = !!(cd && cd.items && Array.from(cd.items).some(it => it.type.indexOf('image') !== -1));
      const plain = (cd && (cd.getData('text/plain') || cd.getData('text'))) || '';
      const ref = clipboardRef.current;
      // Fallback for browsers that drop the custom format: the clipboard still holds exactly what we copied
      if (!hasImage && ref && plain && plain === ref.clipText) {
        e.preventDefault();
        pasteBoardData(ref);
        return;
      }

      // 1. Check for Image Data in Clipboard
      if (e.clipboardData && e.clipboardData.items) {
        const items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf("image") !== -1) {
            e.preventDefault();
            takeSnapshot();
            const file = items[i].getAsFile();
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                let w = img.width;
                let h = img.height;
                const maxD = 400; // Limit initial spawn size
                if (w > maxD || h > maxD) {
                   const ratio = Math.min(maxD/w, maxD/h);
                   w *= ratio; h *= ratio;
                }
                setElements(els => {
                   const rect = workspaceRef.current.getBoundingClientRect();
                   const centerX = (-transform.x + rect.width / 2) / transform.scale;
                   const centerY = (-transform.y + rect.height / 2) / transform.scale;
                   return [...els, {
                    id: generateId(), type: 'image', 
                    x: centerX - w/2, y: centerY - h/2, 
                    width: w, height: h,
                    content: event.target.result
                  }];
                });
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            return; 
          }
        }
      }

      // 2. Check for URL Data 
      const text = e.clipboardData?.getData('text');
      if (!text) return;
      
      const urlRegex = /^https?:\/\/(www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*)/i;
      if (urlRegex.test(text)) {
        e.preventDefault();
        takeSnapshot();
        
        let domain = text;
        try { domain = new URL(text).hostname.replace('www.', ''); } catch(err) {}

        const rect = workspaceRef.current.getBoundingClientRect();
        const centerX = (-transform.x + rect.width / 2) / transform.scale;
        const centerY = (-transform.y + rect.height / 2) / transform.scale;
        const newLinkId = generateId();
        
        const newLink = {
            id: newLinkId, 
            type: 'link', 
            x: centerX - 120, 
            y: centerY - 40, 
            width: 240, 
            height: 80,
            url: text, 
            domain: domain,
            title: 'Loading preview...',
            thumbnail: null,
            color: isDark ? '#ffffff' : '#000000', 
            textColor: 'default',
            strokeColor: 'transparent',
            strokeWidth: 2
        };
        
        setElements(els => [...els, newLink]);

        // Asynchronous metadata fetch
        let thumbnail = null;
        let title = domain;
        let isMap = text.includes('google.com/maps') || text.includes('maps.app.goo.gl');
        
        const ytMatch = text.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
        if (ytMatch) {
            thumbnail = `https://img.youtube.com/vi/${ytMatch[1]}/hqdefault.jpg`;
            try {
                const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(text)}`);
                const data = await res.json();
                if (data.title) title = data.title;
            } catch(err) {}
        } else {
            try {
                const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(text)}`);
                const data = await res.json();
                if (data.status === 'success' && data.data) {
                    if (data.data.title) {
                        title = data.data.title;
                        if (isMap) title = title.replace(' - Google Maps', ''); 
                    }
                    if (data.data.image?.url) thumbnail = data.data.image.url; 
                }
            } catch(err) {}

            // Fallback map image if Microlink failed, safely encoded for html-to-image
            if (isMap && !thumbnail) {
                if (title === domain) title = "Google Maps Location"; 
                const svgStr = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='200'><rect width='400' height='200' fill='#e2e8f0'/><path d='M-50 50 L 100 150 L 250 -50 L 450 100 L 450 200 L -50 200 Z' fill='#cbd5e1'/><path d='M 100 -50 L 150 250 M 300 -50 L 250 250 M -50 100 L 450 80' stroke='#ffffff' stroke-width='6'/><path d='M200 60 c-16.6 0-30 13.4-30 30 c0 22.5 30 50 30 50 s30-27.5 30-50 c0-16.6-13.4-30-30-30 z' fill='#ef4444'/><circle cx='200' cy='90' r='10' fill='#ffffff'/><text x='200' y='160' font-family='sans-serif' font-size='22' font-weight='bold' fill='#333333' text-anchor='middle'>${title.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</text></svg>`;
                thumbnail = `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svgStr)))}`;
            }
        }

        setElements(els => els.map(el => {
            if (el.id === newLinkId) {
                return {
                    ...el,
                    title: title,
                    thumbnail: thumbnail,
                    y: centerY - (thumbnail ? 120 : 40),
                    height: thumbnail ? 240 : 80
                };
            }
            return el;
        }));
        return;
      }

      // 3. Plain text from outside → new text box in the middle of the view
      if (text.trim()) {
        e.preventDefault();
        takeSnapshot();
        const rect = workspaceRef.current.getBoundingClientRect();
        const centerX = (-transform.x + rect.width / 2) / transform.scale;
        const centerY = (-transform.y + rect.height / 2) / transform.scale;
        const estLines = text.split('\n').reduce((n, line) => n + Math.max(1, Math.ceil(line.length / 30)), 0);
        const h = Math.min(800, Math.max(60, estLines * 26 + 24));
        const newText = {
          id: generateId(), type: 'text', x: centerX - 160, y: centerY - h / 2, width: 320, height: h,
          content: text, textColor: 'default', fontSize: 18, textAlign: 'left'
        };
        setElements(els => [...els, newText]);
        setSelectedIds(new Set([newText.id]));
      }
    };

    window.addEventListener('paste', handlePaste);
    return () => window.removeEventListener('paste', handlePaste);
  });

  // --- UNDO/REDO LOGIC ---
  const takeSnapshot = () => {
    const { elements, frames, connections } = liveRef.current;
    setPast(p => {
        const last = p[p.length - 1];
        // Reference equality — state is immutable, so identical refs = no change.
        // O(1) instead of serializing the whole project (huge win for large boards).

    const previous = past[i];
    setFuture(f => [{ elements: cur.elements, frames: cur.frames, connections: cur.connections }, ...f].slice(0, 50));
    setPast(past.slice(0, i));
    setElements(previous.elements);
    setFrames(previous.frames);
    setConnections(previous.connections);

    const savedOverflow = workspace.style.overflow;
    workspace.style.width = bounds.width + 'px';
    workspace.style.height = bounds.height + 'px';
    workspace.style.overflow = 'visible'; // Allow full render
    
    // Explicitly stretch background layer to cover the entire capture area
    bgLayer.style.width = bounds.width + 'px';
    bgLayer.style.height = bounds.height + 'px';

    try {
      const captureOpts = {
        width: bounds.width,
        height: bounds.height,
        pixelRatio: exportScale,
        filter: (node) => !node?.getAttribute?.('data-html2canvas-ignore'),
        skipFonts: true, // Prevents html-to-image from crashing on external fonts
        imagePlaceholder: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='
      };

      let dataUrl;
      if (format === 'jpg') {
        captureOpts.quality = 0.92;
        dataUrl = await htmlToImage.toJpeg(workspace, captureOpts);
      } else if (format === 'png') {
        captureOpts.backgroundColor = null; 
        dataUrl = await htmlToImage.toPng(workspace, captureOpts);
      } else if (format === 'svg') {
        dataUrl = await htmlToImage.toSvg(workspace, captureOpts);
      } else if (format === 'pdf') {
        // Use JPEG for PDF — 85% quality gives ~5-10x smaller files than PNG
        captureOpts.quality = 0.85;
        dataUrl = await htmlToImage.toJpeg(workspace, captureOpts);
      } else {
        dataUrl = await htmlToImage.toPng(workspace, captureOpts);
      }

      if (format === 'svg') {
        const link = document.createElement('a');
        link.download = `${project.name || 'utku-board'}.svg`;
        link.href = dataUrl;
        link.click();
      } else if (format === 'pdf') {
        const imgWidth = bounds.width * exportScale;
        const imgHeight = bounds.height * exportScale;
        const orientation = imgWidth > imgHeight ? 'landscape' : 'portrait';
        const pdf = new jspdf.jsPDF({
          orientation,
          unit: 'px',
          format: [imgWidth, imgHeight],
          hotfixes: ['px_scaling'],
          compress: true
        });
        pdf.addImage(dataUrl, 'JPEG', 0, 0, imgWidth, imgHeight);
        
        // Map Clickable Links in PDF (both link-type elements and href-linked elements)
        elements.forEach(el => {
           const url = (el.type === 'link' && el.url) ? el.url : el.href;
           if (url) {
              const elX = el.x !== undefined ? el.x : 0;
              const elY = el.y !== undefined ? el.y : 0;
              const linkX = (elX - bounds.x) * exportScale;
              const linkY = (elY - bounds.y) * exportScale;
              const linkW = (el.width === 'auto' ? 280 : (el.width || 200)) * exportScale;
              let linkH;
              if (el.type === 'link') linkH = (el.height === 'auto' ? (el.thumbnail ? 240 : 80) : el.height) * exportScale;
              else linkH = (el.height === 'auto' ? 80 : (el.height || 80)) * exportScale;
              pdf.link(linkX, linkY, linkW, linkH, { url });
           }
        });

        pdf.save(`${project.name || 'utku-board'}.pdf`);
      } else {
        const link = document.createElement('a');
        link.download = `${project.name || 'utku-board'}.${format}`;
        link.href = dataUrl;
        link.click();
      }
    } catch (err) {
      console.error('Export failed:', err);
      alert('Export failed. Make sure all images are valid.');
    } finally {
      transformLayer.style.transform = `translate(${savedTransform.x}px, ${savedTransform.y}px) scale(${savedTransform.scale})`;
      transformLayer.style.transformOrigin = '0 0';
      bgLayer.style.cssText = savedBgStyle;
      workspace.style.width = savedWidth;
      workspace.style.height = savedHeight;
      workspace.style.overflow = savedOverflow;
      setIsExporting(false);
    }
  };

  const fitToScreen = () => {
    const bounds = getContentBounds(elements, frames);
    const workspace = workspaceRef.current;
    if (!workspace) return;
    const rect = workspace.getBoundingClientRect();

    if (!bounds) {
      setTransform({ x: 0, y: 0, scale: 0.5 });
      return;
    }

    const ZOOM_LEVELS = [0.2, 0.35, 0.5, 0.65, 0.8, 1.0];
    const padding = 80;
    const scaleX = (rect.width - padding * 2) / bounds.width;
    const scaleY = (rect.height - padding * 2) / bounds.height;
    const idealScale = Math.min(scaleX, scaleY);

    let bestScale = ZOOM_LEVELS[0];
    for (const level of ZOOM_LEVELS) {
      if (level <= idealScale) bestScale = level;
    }

    const centerX = bounds.x + bounds.width / 2;
    const centerY = bounds.y + bounds.height / 2;
    const newX = (rect.width / 2) - (centerX * bestScale);
    const newY = (rect.height / 2) - (centerY * bestScale);

    setTransform({ x: newX, y: newY, scale: bestScale });
  };

  const ZOOM_LEVELS_REF = [0.2, 0.35, 0.5, 0.65, 0.8, 1.0];

  const zoomIn = () => {
    setTransform(t => {
      let currentIdx = ZOOM_LEVELS_REF.reduce((prev, curr, i) => Math.abs(curr - t.scale) < Math.abs(ZOOM_LEVELS_REF[prev] - t.scale) ? i : prev, 0);
      let nextIdx = Math.min(currentIdx + 1, ZOOM_LEVELS_REF.length - 1);
      const newScale = ZOOM_LEVELS_REF[nextIdx];
      const rect = workspaceRef.current.getBoundingClientRect();
      const cx = rect.width / 2, cy = rect.height / 2;
      return { x: cx - (cx - t.x) * (newScale / t.scale), y: cy - (cy - t.y) * (newScale / t.scale), scale: newScale };
    });
  };

  const zoomOut = () => {
    setTransform(t => {
      let currentIdx = ZOOM_LEVELS_REF.reduce((prev, curr, i) => Math.abs(curr - t.scale) < Math.abs(ZOOM_LEVELS_REF[prev] - t.scale) ? i : prev, 0);
      let nextIdx = Math.max(currentIdx - 1, 0);
      const newScale = ZOOM_LEVELS_REF[nextIdx];
      const rect = workspaceRef.current.getBoundingClientRect();
      const cx = rect.width / 2, cy = rect.height / 2;
      return { x: cx - (cx - t.x) * (newScale / t.scale), y: cy - (cy - t.y) * (newScale / t.scale), scale: newScale };
    });
  };

  // --- DRAG SYSTEM HELPER ---
  const handleDragStart = (e, item, isFrame) => {
    // Middle-click: always let it bubble for pan
    if (e.button === 1) return;
    
    // Right-click: if item is selected, block bubble (context menu will handle it)
    // If item is NOT selected, let it bubble to workspace for panning
    if (e.button === 2) {
      if (selectedIds.has(item.id)) {
        e.stopPropagation(); // block pan — context menu will appear
      }
      return; // never start drag on right-click
    }
    
    e.stopPropagation();
    setHideMenu(false);
    if (editingId && editingId !== item.id) setEditingId(null);
    if (activeTool !== 'select') return;
    if (item.locked) return; // Prevent dragging locked elements

    const rect = workspaceRef.current.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left - transform.x) / transform.scale;
    const mouseY = (e.clientY - rect.top - transform.y) / transform.scale;

    let currentSelection = new Set(selectedIds);

    // MULTI-CLONE (Alt + Drag)
    if (e.altKey && currentSelection.has(item.id)) {
        takeSnapshot();
        const newEls = [];
        const newFrames = [];
        const idMap = {};
        const oldToNewGroupId = {};

        elements.filter(el => currentSelection.has(el.id)).forEach(el => {
            const c = JSON.parse(JSON.stringify(el));
            c.id = generateId();
            if (c.tasks) c.tasks.forEach(t => t.id = generateId());
            if (c.groupId) {
                if (!oldToNewGroupId[c.groupId]) oldToNewGroupId[c.groupId] = generateId();
                c.groupId = oldToNewGroupId[c.groupId];
            }
            idMap[el.id] = c.id;
            newEls.push(c);
        });
        
        frames.filter(f => currentSelection.has(f.id)).forEach(f => {
            const c = JSON.parse(JSON.stringify(f));
            c.id = generateId();
            if (c.groupId) {
                if (!oldToNewGroupId[c.groupId]) oldToNewGroupId[c.groupId] = generateId();
                c.groupId = oldToNewGroupId[c.groupId];
            }
            idMap[f.id] = c.id;
            newFrames.push(c);
        });

        setElements(els => [...els, ...newEls]);
        setFrames(fs => [...fs, ...newFrames]);

        const newSelectionIds = new Set([...newEls.map(e=>e.id), ...newFrames.map(f=>f.id)]);
        setSelectedIds(newSelectionIds);

        const draggedId = idMap[item.id] || item.id;
        
        const selElsData = newEls.map(e => ({ 
            id: e.id, initialX: e.x, initialY: e.y,
            initialStartX: e.startX, initialStartY: e.startY,
            initialEndX: e.endX, initialEndY: e.endY
        }));
        const selFramesData = newFrames.map(f => ({ id: f.id, initialX: f.x, initialY: f.y }));

        if (isFrame) {
            setDraggingFrame({
                id: draggedId,
                startX: mouseX,
                startY: mouseY,
                initialFrameX: item.x,
                initialFrameY: item.y,
                selectedElements: selElsData,
                selectedFrames: selFramesData,
                children: elements.filter(n => n.x >= item.x && n.y >= item.y && n.x + (n.width === 'auto' ? 280 : n.width) <= item.x + item.width && n.y + (n.height === 'auto' ? 100 : n.height) <= item.y + item.height).map(c => ({ id: c.id, initialX: c.x, initialY: c.y }))
            });
        } else {
            setDraggingElement({
                id: draggedId,
                offsetX: mouseX - item.x,
                offsetY: mouseY - item.y,
                initialX: item.x,
                initialY: item.y,
                selectedElements: selElsData,
                selectedFrames: selFramesData,
                isFrame: false,
                children: []
            });
        }
        return;
    }

    // Toggle Selection (Shift + Click)
    if (e.shiftKey) {
        takeSnapshot();
        let newSet = new Set(selectedIds);
        if (newSet.has(item.id)) {
            newSet.delete(item.id);
        } else {
            newSet.add(item.id);
            if (item.groupId) {
                elements.forEach(e => { if (e.groupId === item.groupId) newSet.add(e.id); });
                frames.forEach(f => { if (f.groupId === item.groupId) newSet.add(f.id); });
            }
        }
        setSelectedIds(newSet);
        return;
    }

    if (!currentSelection.has(item.id)) {
        currentSelection = new Set([item.id]);
    }

    let expanded = true;
    while(expanded) {
        expanded = false;
        elements.forEach(e1 => { if (e1.groupId && currentSelection.has(e1.id)) { elements.forEach(e2 => { if (e2.groupId === e1.groupId && !currentSelection.has(e2.id)) { currentSelection.add(e2.id); expanded = true; } }); frames.forEach(f2 => { if (f2.groupId === e1.groupId && !currentSelection.has(f2.id)) { currentSelection.add(f2.id); expanded = true; } }); } });
        frames.forEach(f1 => { if (f1.groupId && currentSelection.has(f1.id)) { elements.forEach(e2 => { if (e2.groupId === f1.groupId && !currentSelection.has(e2.id)) { currentSelection.add(e2.id); expanded = true; } }); frames.forEach(f2 => { if (f2.groupId === f1.groupId && !currentSelection.has(f2.id)) { currentSelection.add(f2.id); expanded = true; } }); } });
    }
    
    takeSnapshot();
    setSelectedIds(currentSelection);

    const selElsData = elements.filter(e => currentSelection.has(e.id)).map(e => ({ 
        id: e.id, initialX: e.x, initialY: e.y,
        initialStartX: e.startX, initialStartY: e.startY,
        initialEndX: e.endX, initialEndY: e.endY
    }));
    const selFramesData = frames.filter(f => currentSelection.has(f.id)).map(f => ({ id: f.id, initialX: f.x, initialY: f.y }));

    if (isFrame) {
        const childNodes = elements.filter(n => n.x >= item.x && n.y >= item.y && n.x + (n.width === 'auto' ? 280 : n.width) <= item.x + item.width && n.y + (n.height === 'auto' ? 100 : n.height) <= item.y + item.height);
        setDraggingFrame({
            id: item.id,
            startX: mouseX,
            startY: mouseY,
            initialFrameX: item.x,
            initialFrameY: item.y,
            selectedElements: selElsData,
            selectedFrames: selFramesData,
            children: childNodes.map(c => ({ id: c.id, initialX: c.x, initialY: c.y }))
        });
    } else {
        setDraggingElement({
            id: item.id,
            offsetX: mouseX - (item.type === 'arrow' ? 0 : item.x),
            offsetY: mouseY - (item.type === 'arrow' ? 0 : item.y),
            initialX: item.x || 0,
            initialY: item.y || 0,
            selectedElements: selElsData,
            selectedFrames: selFramesData,
            isFrame: false,
            children: []
        });
    }
  };

  const handlePointerDown = (e) => {
    if (e.target.id === 'workspace-bg') {
      setEditingId(null);
      setShowShapeMenu(false);
      setShowEmojiMenu(false);
      setHideMenu(false);
      setCardHeaderMenu(null);
      setRightClickMenu(null);
    }

    if (e.button === 1 || e.button === 2) {
      e.preventDefault();
      setIsPanning(true);
      return;
    }
    
    if (e.target.id === 'workspace-bg' && e.button === 0) {
      const rect = workspaceRef.current.getBoundingClientRect();
      const startX = (e.clientX - rect.left - transform.x) / transform.scale;
      const startY = (e.clientY - rect.top - transform.y) / transform.scale;

      if (activeTool === 'select' && e.shiftKey) {
        // Shift+drag on empty canvas = connection knife
        setCutLine({ points: [{ x: startX, y: startY }] });
        return;
      }

      if (activeTool === 'select') {
        setSelectionBox({ startX, startY, currentX: startX, currentY: startY });
        if (!e.ctrlKey && !e.metaKey) setSelectedIds(new Set());
      } else if (activeTool === 'pen') {
        takeSnapshot();
        setCurrentPath({ points: [{x: startX, y: startY}], color: penColor, width: penWidth });
      } else {
        takeSnapshot();
        let sx = startX, sy = startY;
        if (snapEnabled) { sx = Math.round(sx/30)*30; sy = Math.round(sy/30)*30; }
        setDrawingAction({ startX: sx, startY: sy, currentX: sx, currentY: sy, type: activeTool === 'shape' ? subTool : activeTool });
      }
    }
  };

  const handlePointerMove = (e) => {
    if (isPanning) {
      // Direct DOM manipulation — bypasses React re-render for smooth 60fps pan
      const t = transformRef.current;
      t.x += e.movementX;
      t.y += e.movementY;
      if (!rafId.current) {
        rafId.current = requestAnimationFrame(() => {
          const tl = document.getElementById('transform-layer');
          const bg = document.getElementById('workspace-bg');
          if (tl) tl.style.transform = `translate(${t.x}px, ${t.y}px) scale(${t.scale})`;
          if (bg) {
            bg.style.backgroundPosition = `${t.x}px ${t.y}px`;
          }
          rafId.current = null;
        });
      }
      return;
    }

    const rect = workspaceRef.current.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left - transform.x) / transform.scale;
    const mouseY = (e.clientY - rect.top - transform.y) / transform.scale;

    if (cutLine) {
      const lp = cutLine.points[cutLine.points.length - 1];
      if (Math.hypot(mouseX - lp.x, mouseY - lp.y) > 4) {
        setCutLine({ points: [...cutLine.points, { x: mouseX, y: mouseY }] });
      }
      return;
    }

    if (currentPath) {
      let nX = mouseX;
      let nY = mouseY;
      if (e.shiftKey && currentPath.points.length > 0) {
          const startP = currentPath.points[0];
          const dx = mouseX - startP.x;
          const dy = mouseY - startP.y;
          const angle = Math.atan2(dy, dx) * 180 / Math.PI;
          const snappedAngle = Math.round(angle / 45) * 45;
          const rad = snappedAngle * Math.PI / 180;
          const dist = Math.hypot(dx, dy);
          nX = startP.x + Math.cos(rad) * dist;
          nY = startP.y + Math.sin(rad) * dist;
          setCurrentPath({ ...currentPath, points: [startP, { x: nX, y: nY }] });
      } else {
          setCurrentPath({ ...currentPath, points: [...currentPath.points, { x: nX, y: nY }] });
      }
    }

    if (drawingAction) {
      let nX = mouseX;
      let nY = mouseY;
      
      if (e.shiftKey) {
          if (drawingAction.type === 'arrow' || drawingAction.type === 'pen') {
              const dx = mouseX - drawingAction.startX;
              const dy = mouseY - drawingAction.startY;
              const angle = Math.atan2(dy, dx) * 180 / Math.PI;
              const snappedAngle = Math.round(angle / 45) * 45;
              const rad = snappedAngle * Math.PI / 180;
              const dist = Math.hypot(dx, dy);
              nX = drawingAction.startX + Math.cos(rad) * dist;
              nY = drawingAction.startY + Math.sin(rad) * dist;
          } else if (['rect', 'circle', 'triangle'].includes(drawingAction.type)) {
              const dx = mouseX - drawingAction.startX;
              const dy = mouseY - drawingAction.startY;
              const maxD = Math.max(Math.abs(dx), Math.abs(dy));
              nX = drawingAction.startX + maxD * Math.sign(dx || 1);
              nY = drawingAction.startY + maxD * Math.sign(dy || 1);
          }
      } else if (snapEnabled) {
          nX = Math.round(nX / 30) * 30;
          nY = Math.round(nY / 30) * 30;
      }
      setDrawingAction({ ...drawingAction, currentX: nX, currentY: nY });
    }

    if (selectionBox) {
      setSelectionBox({ ...selectionBox, currentX: mouseX, currentY: mouseY });
    }

    if (draggingElement) {
        setHideMenu(true);
        const rawX = mouseX - draggingElement.offsetX;
        const rawY = mouseY - draggingElement.offsetY;
        const snapX = snapEnabled ? Math.round(rawX / 30) * 30 : rawX;
        const snapY = snapEnabled ? Math.round(rawY / 30) * 30 : rawY;

        const dx = snapX - draggingElement.initialX;
        const dy = snapY - draggingElement.initialY;
        dragDeltaRef.current = { dx, dy };

        // RAF-based DOM manipulation — bypasses React re-render for smooth 60fps drag
        if (!dragRafId.current) {
          dragRafId.current = requestAnimationFrame(() => {
            const dd = dragDeltaRef.current;
            const allIds = new Set([
              ...draggingElement.selectedElements.map(s => s.id),
              ...(draggingElement.selectedFrames || []).map(s => s.id),
              ...(draggingElement.children || []).map(c => c.id)
            ]);
            
            allIds.forEach(id => {
              const domEl = document.querySelector('[data-element-id="' + id + '"], [data-frame-id="' + id + '"]');
              if (domEl) {
                // Find initial position for this element
                const selData = draggingElement.selectedElements.find(s => s.id === id) 
                  || (draggingElement.selectedFrames || []).find(s => s.id === id);
                const childData = (draggingElement.children || []).find(c => c.id === id);
                const initial = selData || childData;
                if (initial) {
                  domEl.style.transform = 'translate(' + dd.dx + 'px,' + dd.dy + 'px)';
                }
              }
            });
            
            updateConnectionsDOM(allIds, dd.dx, dd.dy);
            
            dragRafId.current = null;
          });
        }
    }

    if (draggingFrame) {
        setHideMenu(true);
        const dx = mouseX - draggingFrame.startX;
        const dy = mouseY - draggingFrame.startY;

        const targetX = snapEnabled ? Math.round((draggingFrame.initialFrameX + dx) / 30) * 30 : draggingFrame.initialFrameX + dx;
        const targetY = snapEnabled ? Math.round((draggingFrame.initialFrameY + dy) / 30) * 30 : draggingFrame.initialFrameY + dy;
        const snappedDx = targetX - draggingFrame.initialFrameX;
        const snappedDy = targetY - draggingFrame.initialFrameY;
        dragDeltaRef.current = { dx: snappedDx, dy: snappedDy };

        // RAF-based DOM manipulation for frame drag
        if (!dragRafId.current) {
          dragRafId.current = requestAnimationFrame(() => {
            const dd = dragDeltaRef.current;
            const allIds = new Set([
              ...(draggingFrame.selectedFrames || []).map(s => s.id),
              ...(draggingFrame.selectedElements || []).map(s => s.id),
              ...(draggingFrame.children || []).map(c => c.id),
              draggingFrame.id
            ]);
            
            allIds.forEach(id => {
              const domEl = document.querySelector('[data-element-id="' + id + '"], [data-frame-id="' + id + '"]');
              if (domEl) domEl.style.transform = 'translate(' + dd.dx + 'px,' + dd.dy + 'px)';
            });
            
            updateConnectionsDOM(allIds, dd.dx, dd.dy);
            
            dragRafId.current = null;
          });
        }
    }

    if (draggingArrowNode) {
        setHideMenu(true);
        let nX = mouseX;
        let nY = mouseY;
        
        if (e.shiftKey) {
            const el = elements.find(e => e.id === draggingArrowNode.id);
            if (el) {
                const fixedX = draggingArrowNode.node === 'start' ? el.endX : el.startX;
                const fixedY = draggingArrowNode.node === 'start' ? el.endY : el.startY;
                const dx = mouseX - fixedX;
                const dy = mouseY - fixedY;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                const snappedAngle = Math.round(angle / 45) * 45;
                const rad = snappedAngle * Math.PI / 180;
                const dist = Math.hypot(dx, dy);
                nX = fixedX + Math.cos(rad) * dist;
                nY = fixedY + Math.sin(rad) * dist;
            }
        } else {
            // Always snap arrow endpoints to nearest element port within 60px
            let minD = 60 / transform.scale;
            let closest = null;
            [...elements, ...frames].forEach(node => {
                if (node.type === 'arrow' || node.type === 'reroute') return;
                ['top','bottom','left','right'].forEach(port => {
                    const coords = getPortCoords(node.id, port);
                    const dist = Math.hypot(coords.x - mouseX, coords.y - mouseY);
                    if (dist < minD) { minD = dist; closest = { coords, nodeId: node.id, port }; }
                });
            });
            if (closest) { nX = closest.coords.x; nY = closest.coords.y; }
            else if (snapEnabled) {
                nX = Math.round(nX / 30) * 30;
                nY = Math.round(nY / 30) * 30;
            }
        }
        
        setElements(els => els.map(el => {
            if (el.id === draggingArrowNode.id) {
                if (draggingArrowNode.node === 'start') return { ...el, startX: nX, startY: nY };
                return { ...el, endX: nX, endY: nY };
            }
            return el;
        }));
    }

    if (resizingElement) {
      setHideMenu(true);
      const dx = (e.clientX - resizingElement.startX) / transform.scale;
      const dy = (e.clientY - resizingElement.startY) / transform.scale;
      setElements(els => els.map(el => {
        if (el.id === resizingElement.id) {
          if (el.type === 'image') {
            const scaleX = (resizingElement.startW + dx) / resizingElement.startW;
            const scaleY = (resizingElement.startH + dy) / resizingElement.startH;
            const scale = Math.max(scaleX, scaleY);
            
            let newW = resizingElement.startW * scale;
            let newH = resizingElement.startH * scale;
            
            if (snapEnabled) {
                newW = Math.round(newW / 30) * 30;
                if (newW < 30) newW = 30;
                newH = newW * (resizingElement.startH / resizingElement.startW);
            }

            if (newW < 50 || newH < 50) {
                const minScale = Math.max(50 / resizingElement.startW, 50 / resizingElement.startH);
                newW = resizingElement.startW * minScale;
                newH = resizingElement.startH * minScale;
            }
            return { ...el, width: newW, height: newH };
          } else {
            let newW = resizingElement.startW + dx;
            let newH = resizingElement.startH + dy;
            if (snapEnabled) {
                newW = Math.round(newW / 30) * 30;
                newH = Math.round(newH / 30) * 30;
            }
            return {
              ...el, 
              width: Math.max(el.type === 'text' ? 100 : el.type === 'card' ? 200 : 50, newW), 
              height: Math.max(el.type === 'text' ? 40 : el.type === 'card' ? 180 : 50, newH)
            };
          }
        }
        return el;
      }));
    }

    if (resizingFrame) {
      setHideMenu(true);
      const dx = (e.clientX - resizingFrame.startX) / transform.scale;
      const dy = (e.clientY - resizingFrame.startY) / transform.scale;
      let newW = resizingFrame.startW + dx;
      let newH = resizingFrame.startH + dy;
      if (snapEnabled) {
          newW = Math.round(newW / 30) * 30;
          newH = Math.round(newH / 30) * 30;
      }
      setFrames(fs => fs.map(f => f.id === resizingFrame.id ? {
        ...f,
        width: Math.max(200, newW),
        height: Math.max(100, newH)
      } : f));
    }

    if (connectingStart) {
      // MAGNETIC SNAPPING ASSISTANCE
      let snapped = false;
      let closestPort = null;
      let minDistance = 40 / transform.scale; 

      const checkPorts = (nodes) => {
          for (const node of nodes) {
              if (node.id === connectingStart.nodeId) continue;
              const ports = node.type === 'reroute'
                ? [getPortCoords(connectingStart.nodeId, connectingStart.port).x <= node.x + node.width / 2 ? 'left' : 'right']
                : ['top', 'bottom', 'left', 'right'];
              ports.forEach(port => {
                  const coords = getPortCoords(node.id, port);
                  const dist = Math.hypot(coords.x - mouseX, coords.y - mouseY);
                  if (dist < minDistance) {
                      minDistance = dist;
                      closestPort = { coords, nodeId: node.id, port };
                      snapped = true;
                  }
              });
          }
      };

      checkPorts(elements);
      checkPorts(frames);

      if (snapped) {
          setTempConnectionEnd(closestPort.coords);
          setHoveredPort({ nodeId: closestPort.nodeId, port: closestPort.port });
      } else {
          setTempConnectionEnd({ x: mouseX, y: mouseY });
          setHoveredPort(null);
      }
    }
  };

  const handlePointerUp = () => {
    // Sync RAF-based pan position back to React state (single re-render)
    if (isPanning) {
      const t = transformRef.current;
      setTransform({ x: t.x, y: t.y, scale: t.scale });
      if (rafId.current) { cancelAnimationFrame(rafId.current); rafId.current = null; }
    }
    
    // Sync RAF-based drag to React state (single re-render)
    if (draggingElement || draggingFrame) {
      if (dragRafId.current) { cancelAnimationFrame(dragRafId.current); dragRafId.current = null; }
      const dd = dragDeltaRef.current;
      
      // Clear all CSS transforms
      document.querySelectorAll('[data-element-id], [data-frame-id]').forEach(el => { el.style.transform = ''; });
      const connSvg = document.getElementById('connection-svg');
      if (connSvg) connSvg.style.opacity = '';
      
      if (draggingElement && (dd.dx !== 0 || dd.dy !== 0)) {
        const childIds = new Set((draggingElement.children || []).map(c => c.id));
        setElements(els => els.map(el => {
          const selData = draggingElement.selectedElements.find(s => s.id === el.id);
          if (selData) {
            if (el.type === 'arrow') return { ...el, startX: (selData.initialStartX||0)+dd.dx, startY: (selData.initialStartY||0)+dd.dy, endX: (selData.initialEndX||0)+dd.dx, endY: (selData.initialEndY||0)+dd.dy };
            return { ...el, x: selData.initialX + dd.dx, y: selData.initialY + dd.dy };
          }
          if (childIds.has(el.id) && draggingElement.isFrame) {
            const ch = draggingElement.children.find(c => c.id === el.id);
            return { ...el, x: ch.initialX + dd.dx, y: ch.initialY + dd.dy };
          }
          return el;
        }));
        setFrames(fs => fs.map(f => {
          const selData = (draggingElement.selectedFrames||[]).find(s => s.id === f.id);
          if (selData) return { ...f, x: selData.initialX + dd.dx, y: selData.initialY + dd.dy };
          return f;
        }));
      }
      
      if (draggingFrame && (dd.dx !== 0 || dd.dy !== 0)) {
        const childIds = new Set((draggingFrame.children||[]).map(c => c.id));
        setFrames(fs => fs.map(f => {
          const selData = (draggingFrame.selectedFrames||[]).find(s => s.id === f.id);
          if (selData) return { ...f, x: selData.initialX + dd.dx, y: selData.initialY + dd.dy };
          if (f.id === draggingFrame.id) return { ...f, x: draggingFrame.initialFrameX + dd.dx, y: draggingFrame.initialFrameY + dd.dy };
          return f;
        }));
        setElements(els => els.map(el => {
          const selData = (draggingFrame.selectedElements||[]).find(s => s.id === el.id);
          if (selData) {
            if (el.type === 'arrow') return { ...el, startX: (selData.initialStartX||0)+dd.dx, startY: (selData.initialStartY||0)+dd.dy, endX: (selData.initialEndX||0)+dd.dx, endY: (selData.initialEndY||0)+dd.dy };
            return { ...el, x: selData.initialX + dd.dx, y: selData.initialY + dd.dy };
          }
          if (childIds.has(el.id)) {
            const ch = draggingFrame.children.find(c => c.id === el.id);
            return { ...el, x: ch.initialX + dd.dx, y: ch.initialY + dd.dy };
          }
          return el;
        }));
      }
      
      dragDeltaRef.current = { dx: 0, dy: 0 };
    }
    
    // Knife release: delete every connection the cut line crosses
    if (cutLine) {
      if (cutLine.points.length > 1) {
        const toDelete = new Set();
        connections.forEach(conn => {
          const pathEl = document.querySelector('path[data-conn-id="' + conn.id + '"]');
          if (!pathEl || !pathEl.getTotalLength) return;
          try {
            const L = pathEl.getTotalLength();
            const S = 24, pts = [];
            for (let i = 0; i <= S; i++) pts.push(pathEl.getPointAtLength(L * i / S));
            outer: for (let i = 0; i < cutLine.points.length - 1; i++)
              for (let j = 0; j < pts.length - 1; j++)
                if (segIntersect(cutLine.points[i], cutLine.points[i + 1], pts[j], pts[j + 1])) { toDelete.add(conn.id); break outer; }
          } catch(err) {}
        });
        if (toDelete.size) {
          takeSnapshot();
          setConnections(cs => cs.filter(cn => !toDelete.has(cn.id)));
        }
      }
      setCutLine(null);
    }

    setIsPanning(false);
    setDraggingElement(null);
    setDraggingFrame(null);
    setResizingElement(null);
    setResizingFrame(null);
    setDraggingArrowNode(null);
    
    // Complete snapped connections on mouse release
    if (transferringConnections && hoveredPort) {
        const isSame = (hoveredPort.nodeId === transferringConnections.originNodeId && hoveredPort.port === transferringConnections.originPort);
        if (!isSame) {
            takeSnapshot();
            setConnections(cs => cs.map(c => {
                const match = transferringConnections.conns.find(tc => tc.id === c.id);
                if (!match) return c;
                if (match.side === 'from') return { ...c, fromId: hoveredPort.nodeId, fromPort: hoveredPort.port };
                else return { ...c, toId: hoveredPort.nodeId, toPort: hoveredPort.port };
            }));
        }
    } else if (connectingStart && hoveredPort && !transferringConnections) {
        const dup = connections.some(c => 
          (c.fromId === connectingStart.nodeId && c.fromPort === connectingStart.port && c.toId === hoveredPort.nodeId && c.toPort === hoveredPort.port) ||
          (c.fromId === hoveredPort.nodeId && c.fromPort === hoveredPort.port && c.toId === connectingStart.nodeId && c.toPort === connectingStart.port)
        );
        if (!dup) {
            takeSnapshot();
            setConnections([...connections, {
                id: generateId(), fromId: connectingStart.nodeId, fromPort: connectingStart.port,
                toId: hoveredPort.nodeId, toPort: hoveredPort.port, style: 'curved', animated: true, color: '#e07a5f', thickness: 5
            }]);
        }
    }
    
    setConnectingStart(null);
    setTempConnectionEnd(null);
    setHoveredPort(null);
    setTransferringConnections(null);

    if (currentPath && currentPath.points.length > 1) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      currentPath.points.forEach(p => {
        if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
      });
      const normalizedPoints = currentPath.points.map(p => ({ x: p.x - minX, y: p.y - minY }));
      setElements([...elements, {
        id: generateId(), type: 'draw', 
        x: minX, y: minY, 
        width: Math.max(maxX - minX, 1), 
        height: Math.max(maxY - minY, 1),
        points: normalizedPoints, color: currentPath.color, strokeWidth: currentPath.width
      }]);
      setCurrentPath(null);
    } else if (currentPath) {
       setCurrentPath(null);
    }

    if (drawingAction) {
      // Arrow
      if (drawingAction.type === 'arrow') {
        let sX = drawingAction.startX, sY = drawingAction.startY;
        let endX = drawingAction.currentX;
        let endY = drawingAction.currentY;
        
        // Instant one-click default size
        if (Math.abs(endX - sX) < 20 && Math.abs(endY - sY) < 20) {
            endX = sX + 150;
            endY = sY + 150;
            if (snapEnabled) { endX = Math.round(endX / 30) * 30; endY = Math.round(endY / 30) * 30; }
        }
        
        // Auto-snap both endpoints to nearest element ports within 60px
        const snapToPort = (px, py) => {
          let minD = 60 / transform.scale, best = { x: px, y: py };
          [...elements, ...frames].forEach(node => {
            if (node.type === 'arrow') return;
            ['top','bottom','left','right'].forEach(port => {
              const c = getPortCoords(node.id, port);
              const d = Math.hypot(c.x - px, c.y - py);
              if (d < minD) { minD = d; best = c; }
            });
          });
          return best;
        };
        const snappedStart = snapToPort(sX, sY);
        const snappedEnd = snapToPort(endX, endY);

        const newEl = {
          id: generateId(), type: 'arrow',
          startX: snappedStart.x, startY: snappedStart.y,
          endX: snappedEnd.x, endY: snappedEnd.y,
          color: '#e07a5f', strokeWidth: 3
        };
        setElements([...elements, newEl]);
        setDrawingAction(null);
        // FIX: Removed setActiveTool('select') so the Arrow tool stays sticky!
        return;
      }

      const rawW = Math.abs(drawingAction.currentX - drawingAction.startX);
      const rawH = Math.abs(drawingAction.currentY - drawingAction.startY);
      
      let x = Math.min(drawingAction.startX, drawingAction.currentX);
      let y = Math.min(drawingAction.startY, drawingAction.currentY);
      
      let finalW = rawW;
      let finalH = rawH;
      const isClick = rawW < 20 && rawH < 20;

      if (isClick) {
          // New, much larger default dimensions for one-click creation
          if (drawingAction.type === 'card') {
              finalW = 280;
              finalH = 'auto';
          } else if (drawingAction.type === 'text') {
              finalW = 240;
              finalH = 120;
          } else if (drawingAction.type === 'emoji') {
              finalW = 100;
              finalH = 100;
          } else {
              // Standard Shapes (Rect, Circle, Triangle)
              finalW = 150;
              finalH = 150;
          }
      } else if (snapEnabled && drawingAction.type !== 'emoji') {
          finalW = Math.max(30, Math.round(rawW / 30) * 30);
          finalH = Math.max(30, Math.round(rawH / 30) * 30);
      }

      if (isClick) {
         // Perfectly center the newly created large shape under the cursor
         if (drawingAction.type === 'emoji') {
             x = drawingAction.startX - 50;
             y = drawingAction.startY - 50;
         } else {
             x = drawingAction.startX - (finalW === 'auto' ? 140 : finalW / 2);
             y = drawingAction.startY - (finalH === 'auto' ? 60 : finalH / 2);
         }
         
         if (snapEnabled) {
             x = Math.round(x / 30) * 30;
             y = Math.round(y / 30) * 30;
         }
      }

      let defaultContent = '';
      if (drawingAction.type === 'emoji') defaultContent = selectedEmoji;

      let finalColor = PASTEL_COLORS[7]; // Fallback
      if (['rect', 'circle', 'triangle', 'card'].includes(drawingAction.type)) {
         finalColor = isDark ? '#ffffff' : '#000000';
      }
      const newEl = {
        id: generateId(), type: drawingAction.type, x, y, width: finalW, height: finalH,
        content: defaultContent,
        tasks: drawingAction.type === 'card' ? [{ id: generateId(), text: '' }] : [],
        color: finalColor,
        textColor: 'default',
        strokeColor: 'transparent',
        strokeWidth: 2,
        fontSize: 18,
        headerImage: null
      };
      
      setElements([...elements, newEl]);
      setDrawingAction(null);
    }

    if (selectionBox) {
      const minX = Math.min(selectionBox.startX, selectionBox.currentX);
      const maxX = Math.max(selectionBox.startX, selectionBox.currentX);
      const minY = Math.min(selectionBox.startY, selectionBox.currentY);
      const maxY = Math.max(selectionBox.startY, selectionBox.currentY);

      // AutoCAD-style: L-to-R = window (blue, fully contained), R-to-L = crossing (green, touch)
      const isWindow = selectionBox.currentX >= selectionBox.startX;
      let newSelected = new Set(selectedIds);
      elements.forEach(el => {
        if (el.type === 'arrow') {
            const sX = el.startX ?? el.x + (el.relStartX || 0);
            const sY = el.startY ?? el.y + (el.relStartY || 0);
            const eX = el.endX ?? el.x + (el.relEndX || 0);
            const eY = el.endY ?? el.y + (el.relEndY || 0);
            const sIn = sX >= minX && sX <= maxX && sY >= minY && sY <= maxY;
            const eIn = eX >= minX && eX <= maxX && eY >= minY && eY <= maxY;
            if (isWindow ? (sIn && eIn) : (sIn || eIn)) newSelected.add(el.id);
        } else {
            const ew = el.width==='auto'?280:el.width, eh = getExactHeight(el);
            if (isWindow
              ? (el.x >= minX && el.x + ew <= maxX && el.y >= minY && el.y + eh <= maxY)
              : (el.x < maxX && el.x + ew > minX && el.y < maxY && el.y + eh > minY)) newSelected.add(el.id);
        }
      });
      frames.forEach(f => {
         if (isWindow
           ? (f.x >= minX && f.x + f.width <= maxX && f.y >= minY && f.y + f.height <= maxY)
           : (f.x < maxX && f.x + f.width > minX && f.y < maxY && f.y + f.height > minY)) newSelected.add(f.id);
      });

      let expanded = true;
      while(expanded) {
          expanded = false;
          elements.forEach(e1 => { if (e1.groupId && newSelected.has(e1.id)) { elements.forEach(e2 => { if (e2.groupId === e1.groupId && !newSelected.has(e2.id)) { newSelected.add(e2.id); expanded = true; } }); frames.forEach(f2 => { if (f2.groupId === e1.groupId && !newSelected.has(f2.id)) { newSelected.add(f2.id); expanded = true; } }); } });
          frames.forEach(f1 => { if (f1.groupId && newSelected.has(f1.id)) { elements.forEach(e2 => { if (e2.groupId === f1.groupId && !newSelected.has(e2.id)) { newSelected.add(e2.id); expanded = true; } }); frames.forEach(f2 => { if (f2.groupId === f1.groupId && !newSelected.has(f2.id)) { newSelected.add(f2.id); expanded = true; } }); } });
      }

      setSelectedIds(newSelected);
      setSelectionBox(null);
    }
  };

  const handleWorkspaceDrop = (e) => {
    e.preventDefault();
    
    // Image Drop Handle (Multiple Files Support)
    const files = Array.from(e.dataTransfer.files || []);
    const imageFiles = files.filter(f => f.type.startsWith('image/'));

    if (imageFiles.length > 0) {
      takeSnapshot();
      const rect = workspaceRef.current.getBoundingClientRect();
      const baseMouseX = (e.clientX - rect.left - transform.x) / transform.scale;
      const baseMouseY = (e.clientY - rect.top - transform.y) / transform.scale;

      imageFiles.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
             let w = img.width;
             let h = img.height;
             const maxD = 400;
             if (w > maxD || h > maxD) {
                const ratio = Math.min(maxD/w, maxD/h);
                w *= ratio; h *= ratio;
             }
             
             // Shift each image by 40px so they cascade instead of perfectly overlapping
             const offsetX = index * 40;
             const offsetY = index * 40;

             setElements(els => [...els, {
              id: generateId(), 
              type: 'image', 
              x: baseMouseX - w/2 + offsetX, 
              y: baseMouseY - h/2 + offsetY, 
              width: w, 
              height: h,
              content: event.target.result
            }]);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
      return;
    }

    // Trello Task Handle (Dropped on empty workspace)
    setTaskDragData(null);
    setTaskDropTarget(null);
    try {
      const data = JSON.parse(e.dataTransfer.getData('application/json'));
      if (data.sourceListId && data.taskId) {
        takeSnapshot();
        const rect = workspaceRef.current.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left - transform.x) / transform.scale;
        const mouseY = (e.clientY - rect.top - transform.y) / transform.scale;

        setElements(els => {
          const sourceList = els.find(el => el.id === data.sourceListId);
          if(!sourceList) return els;
          const taskToMove = sourceList.tasks.find(t => t.id === data.taskId);
          
          const filteredEls = els.map(el => {
            if (el.id === data.sourceListId) return { ...el, tasks: el.tasks.filter(t => t.id !== data.taskId), height: 'auto' };
            return el;
          });

          // Create new list for the dropped item
          const newList = {
            id: generateId(), type: 'card', x: mouseX, y: mouseY, width: 280, height: 'auto',
            content: 'New List', tasks: [taskToMove], color: isDark ? '#ffffff' : '#000000', textColor: 'default', strokeColor: 'transparent', strokeWidth: 2
          };

          return [...filteredEls, newList];
        });
      }
    } catch(err) {}
  };

  // Image upload from toolbar (works on iPad for photos/screenshots)
  const handleImageUpload = () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.onchange = (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      takeSnapshot();
      const rect = workspaceRef.current.getBoundingClientRect();
      const centerX = (-transform.x + rect.width / 2) / transform.scale;
      const centerY = (-transform.y + rect.height / 2) / transform.scale;
      files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            const maxD = 400;
            if (w > maxD || h > maxD) { const r = Math.min(maxD/w, maxD/h); w *= r; h *= r; }
            setElements(els => [...els, {
              id: generateId(), type: 'image',
              x: centerX - w/2 + index * 40, y: centerY - h/2 + index * 40,
              width: w, height: h, content: event.target.result
            }]);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };
    input.click();
  };

  const handleHeaderUpload = (cardId) => (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        takeSnapshot();
        updateElement(cardId, { headerImage: event.target.result });
        setCardHeaderMenu(null);
    };
    reader.readAsDataURL(file);
  };

  const onTaskDragStart = (e, listId, taskId) => {
    e.dataTransfer.setData('application/json', JSON.stringify({ sourceListId: listId, taskId }));
    e.dataTransfer.effectAllowed = 'move';
    setTaskDragData({ sourceListId: listId, taskId });
    e.stopPropagation(); 
  };

  const onTaskDragOver = (e, targetListId, insertIndex) => {
