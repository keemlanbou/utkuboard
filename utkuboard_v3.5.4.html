    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect = 'move';
    setTaskDropTarget({ listId: targetListId, insertIndex });
  };

  const onTaskDragEnd = () => {
    setTaskDragData(null);
    setTaskDropTarget(null);
  };

  const onListDrop = (e, targetListId, insertAtIndex) => {
    e.preventDefault();
    e.stopPropagation();
    setTaskDropTarget(null);
    setTaskDragData(null);
    try {
      const data = JSON.parse(e.dataTransfer.getData('application/json'));
      if (!data.sourceListId || !data.taskId) return;
      
      takeSnapshot();
      setElements(els => {
        const sourceList = els.find(el => el.id === data.sourceListId);
        if (!sourceList) return els;
        const taskToMove = sourceList.tasks.find(t => t.id === data.taskId);
        if (!taskToMove) return els;

        if (data.sourceListId === targetListId) {
          // Same card reorder
          const list = els.find(el => el.id === targetListId);
          const oldTasks = [...list.tasks];
          const oldIndex = oldTasks.findIndex(t => t.id === data.taskId);
          oldTasks.splice(oldIndex, 1);
          let newIndex = insertAtIndex !== undefined ? insertAtIndex : oldTasks.length;
          if (oldIndex < newIndex) newIndex = Math.max(0, newIndex - 1);
          oldTasks.splice(newIndex, 0, taskToMove);
          return els.map(el => el.id === targetListId ? { ...el, tasks: oldTasks, height: 'auto' } : el);
        } else {
          // Cross-card transfer at specific position
          return els.map(el => {
            if (el.id === data.sourceListId) return { ...el, tasks: el.tasks.filter(t => t.id !== data.taskId), height: 'auto' };
            if (el.id === targetListId) {
              const newTasks = [...el.tasks];
              const idx = insertAtIndex !== undefined ? insertAtIndex : newTasks.length;
              newTasks.splice(idx, 0, taskToMove);
              return { ...el, tasks: newTasks, height: 'auto' };
            }
            return el;
          });
        }
      });
    } catch(err) {}
  };


  // Re-home task output connections when a task moves to another card
  useEffect(() => {
    setConnections(cs => {
      let changed = false;
      const next = cs.map(cn => {
        const fix = (nodeId, port) => {
          if (!port || !port.startsWith('out-')) return null;
          const tid = port.slice(4);
          const owner = elements.find(el => el.type === 'card' && el.tasks?.some(t => t.id === tid));
          return (owner && owner.id !== nodeId) ? owner.id : null;
        };
        const nf = fix(cn.fromId, cn.fromPort), nt = fix(cn.toId, cn.toPort);
        if (nf || nt) { changed = true; return { ...cn, fromId: nf || cn.fromId, toId: nt || cn.toId }; }
        return cn;
      });
      return changed ? next : cs;
    });
  }, [elements]);

  // Live-update connection SVG paths during RAF drag (no React re-render)
  const updateConnectionsDOM = (draggedIds, dx, dy) => {
    connections.forEach(conn => {
      const f = draggedIds.has(conn.fromId), t = draggedIds.has(conn.toId);
      if (!f && !t) return;
      let p1 = getPortCoords(conn.fromId, conn.fromPort);
      let p2 = getPortCoords(conn.toId, conn.toPort);
      if (f) p1 = { x: p1.x + dx, y: p1.y + dy };
      if (t) p2 = { x: p2.x + dx, y: p2.y + dy };
      const d = generatePath(p1, p2, conn.style, conn.fromPort, conn.toPort);
      document.querySelectorAll('[data-conn-id="' + conn.id + '"]').forEach(p => p.setAttribute('d', d));
      const dot = document.querySelector('[data-conn-dot="' + conn.id + '"]');
      if (dot) { dot.setAttribute('cx', p2.x); dot.setAttribute('cy', p2.y); }
    });
  };

  const updateElement = (id, updates) => setElements(els => els.map(el => el.id === id ? { ...el, ...updates } : el));
  const updateFrame = (id, updates) => setFrames(fs => fs.map(f => f.id === id ? { ...f, ...updates } : f));

  // Double-click a wire → split it with a movable reroute node (Unreal Blueprint style).
  // Drag the dot to move it; drag from its side handles to branch out as many wires as you like.
  const REROUTE_W = 36, REROUTE_H = 24;
  const insertReroute = (conn, e) => {
    const rect = workspaceRef.current.getBoundingClientRect();
    let x = (e.clientX - rect.left - transform.x) / transform.scale;
    let y = (e.clientY - rect.top - transform.y) / transform.scale;
    // Put the dot exactly on the wire (nearest point of the drawn path)
    const pathEl = document.querySelector('path[data-conn-id="' + conn.id + '"]');
    if (pathEl && pathEl.getTotalLength) {
      try {
        const L = pathEl.getTotalLength();
        let best = null, bestD = Infinity;
        for (let i = 0; i <= 80; i++) {
          const pt = pathEl.getPointAtLength(L * i / 80);
          const d = Math.hypot(pt.x - x, pt.y - y);
          if (d < bestD) { bestD = d; best = pt; }
        }
        if (best) { x = best.x; y = best.y; }
      } catch (err) {}
    }
    const p1 = getPortCoords(conn.fromId, conn.fromPort);
    const p2 = getPortCoords(conn.toId, conn.toPort);
    const ltr = p1.x <= p2.x; // flow direction decides which side is "in" and which is "out"
    const rid = generateId();
    takeSnapshot();
    setElements(els => [...els, { id: rid, type: 'reroute', x: x - REROUTE_W / 2, y: y - REROUTE_H / 2, width: REROUTE_W, height: REROUTE_H, color: conn.color || '#e07a5f' }]);
    setConnections(cs => cs.flatMap(c => c.id !== conn.id ? [c] : [
      { ...c, toId: rid, toPort: ltr ? 'left' : 'right' },
      { ...c, id: generateId(), fromId: rid, fromPort: ltr ? 'right' : 'left' }
    ]));
    setSelectedIds(new Set([rid]));
  };

  const startConnection = (nodeId, port) => (e) => {
    e.stopPropagation();
    if (e.altKey) {
      // ALT+DRAG PORT: gather ALL connections attached to this exact port
      const fromConns = connections.filter(c => c.fromId === nodeId && c.fromPort === port);
      const toConns = connections.filter(c => c.toId === nodeId && c.toPort === port);
      const allConns = [...fromConns.map(c => ({ ...c, side: 'from' })), ...toConns.map(c => ({ ...c, side: 'to' }))];
      if (allConns.length > 0) {
        setTransferringConnections({ conns: allConns, originNodeId: nodeId, originPort: port });
        setConnectingStart({ nodeId, port });
      }
      return; // Alt = NEVER create new connection
    }
    setConnectingStart({ nodeId, port });
  };
  const completeConnection = (nodeId, port) => (e) => {
    e.stopPropagation();
    
    // TRANSFER MODE: Alt+dragged a port → re-route all connections to new target
    if (transferringConnections) {
      const isSameExactPort = (nodeId === transferringConnections.originNodeId && port === transferringConnections.originPort);
      if (!isSameExactPort) {
        takeSnapshot();
        setConnections(cs => cs.map(c => {
          const match = transferringConnections.conns.find(tc => tc.id === c.id);
          if (!match) return c;
          if (match.side === 'from') return { ...c, fromId: nodeId, fromPort: port };
          else return { ...c, toId: nodeId, toPort: port };
        }));
      }
      setTransferringConnections(null);
      setConnectingStart(null);
      setTempConnectionEnd(null);
      setHoveredPort(null);
      return;
    }
    
    if (connectingStart && connectingStart.nodeId !== nodeId) {
      // Prevent duplicate
      const dup = connections.some(c => 
        (c.fromId === connectingStart.nodeId && c.fromPort === connectingStart.port && c.toId === nodeId && c.toPort === port) ||
        (c.fromId === nodeId && c.fromPort === port && c.toId === connectingStart.nodeId && c.toPort === connectingStart.port)
      );
      if (!dup) {
        takeSnapshot();
        setConnections([...connections, {
          id: generateId(), fromId: connectingStart.nodeId, fromPort: connectingStart.port,
          toId: nodeId, toPort: port, style: 'curved', animated: true, color: '#e07a5f', thickness: 5
        }]);
      }
    }
    setConnectingStart(null);
    setTempConnectionEnd(null);
    setHoveredPort(null);
  };

  const getPortCoords = (nodeId, port) => {
    let node = elements.find(el => el.id === nodeId) || frames.find(f => f.id === nodeId);
    if (!node) return { x: 0, y: 0 };

    // Reroute node: every wire meets at the dot's centre
    if (node.type === 'reroute') return { x: node.x + node.width / 2, y: node.y + node.height / 2 };
    
    // Board-card task output ports: measured from the live task row position
    if (node.type === 'card' && port && port.startsWith('out-')) {
      const cardEl = document.querySelector('[data-element-id="' + nodeId + '"]');
      const taskEl = cardEl && cardEl.querySelector('[data-task-id="' + port.slice(4) + '"]');
      if (cardEl && taskEl) {
        let ty = 0, n = taskEl;
        while (n && n !== cardEl) { ty += n.offsetTop; n = n.offsetParent; }
        const cw = node.width === 'auto' ? 280 : node.width;
        return { x: node.x + cw, y: node.y + ty + taskEl.offsetHeight / 2 };
      }
      return { x: node.x + (node.width === 'auto' ? 280 : node.width), y: node.y + 100 };
    }
    
    const w = node.width === 'auto' ? 280 : node.width;
    
    let h = node.height === 'auto' ? getDOMHeight(nodeId, getExactHeight(node)) : getExactHeight(node);

    switch (port) {
      case 'top': return { x: node.x + w/2, y: node.y };
      case 'bottom': return { x: node.x + w/2, y: node.y + h };
      case 'left': return { x: node.x, y: node.y + h/2 };
      case 'right': return { x: node.x + w, y: node.y + h/2 };
      default: return { x: node.x + w/2, y: node.y + h/2 };
    }
  };

  const generatePath = (p1, p2, style, port1, port2) => {
    const normPort = (p) => (p && p.startsWith && p.startsWith('out')) ? 'right' : (p === 'in' ? 'left' : p);
    port1 = normPort(port1); port2 = normPort(port2);
    if (style === 'straight') return `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
    if (style === 'electric') {
      const midX = (p1.x + p2.x) / 2;
      return `M ${p1.x} ${p1.y} L ${midX} ${p1.y} L ${midX} ${p2.y} L ${p2.x} ${p2.y}`;
    }
    const offset = Math.abs(p2.x - p1.x) * 0.5 + 50;
    const c1x = port1 === 'right' ? p1.x + offset : port1 === 'left' ? p1.x - offset : p1.x;
    const c1y = port1 === 'bottom' ? p1.y + offset : port1 === 'top' ? p1.y - offset : p1.y;
    const c2x = port2 === 'left' ? p2.x - offset : port2 === 'right' ? p2.x + offset : p2.x;
    const c2y = port2 === 'top' ? p2.y - offset : port2 === 'bottom' ? p2.y + offset : p2.y;
    return `M ${p1.x} ${p1.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
  };

  const getCursorStyle = () => {
    if (isPanning) return 'grabbing';
    if (activeTool === 'emoji') {
        const svgStr = `<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text x='50%' y='50%' font-size='24' text-anchor='middle' dominant-baseline='central'>${selectedEmoji}</text></svg>`;
        return `url("data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svgStr)))}") 16 16, crosshair`;
    }
    if (activeTool !== 'select') return 'crosshair';
    if (selectionBox) return 'crosshair';
    return 'default';
  };

  return (
    <div className={`h-screen w-screen overflow-hidden flex flex-col ${isDark ? 'bg-[#1b1916] text-white' : 'bg-[#f4f1ea] text-gray-900'} font-sans select-none`} onContextMenu={e => {
      e.preventDefault();
    }} onClick={() => setRightClickMenu(null)}>
      
      {/* 5MB Limit Warning */}
      {showStorageWarning && (
         <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-red-500 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-[9999]">
             <Icon name="close" size={18} />
             <span className="text-sm font-bold">Your browser data limit has reached a critical point. Please save that project to your PC.</span>
             <button onClick={() => setShowStorageWarning(false)} className="p-1 hover:bg-white/20 rounded-md transition ml-2">
                 <Icon name="close" size={14} />
             </button>
         </div>
      )}

      {/* Keyboard Shortcuts Help Panel */}
      {showHelp && (
        <div className="absolute inset-0 z-[9999] flex items-center justify-center bg-black/40 backdrop-blur-sm" onClick={() => setShowHelp(false)}>
          <div onClick={e => e.stopPropagation()} className={`w-[480px] max-h-[80vh] overflow-y-auto rounded-2xl shadow-2xl border p-6 ${isDark ? 'bg-[#262320] border-zinc-700 text-white' : 'bg-white border-gray-200 text-gray-900'}`}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-lg font-bold flex items-center gap-2"><Icon name="help" size={20}/> Keyboard Shortcuts <span className="text-[10px] font-mono font-normal opacity-40">v{APP_VERSION}</span></h2>
              <button onClick={() => setShowHelp(false)} className="p-1 hover:bg-black/10 dark:hover:bg-white/10 rounded-md"><Icon name="close" size={16}/></button>
            </div>
            <div className="grid grid-cols-2 gap-x-6 gap-y-1.5 text-xs">
              {[
                ['1-7', 'Tool selection'],
                ['Ctrl+S', 'Save (same file after the first time)'],
                ['Ctrl+Shift+S', 'Save As (choose a new file)'],
                ['Ctrl+Z', 'Undo'],
                ['Ctrl+Shift+Z / Ctrl+Y', 'Redo'],
                ['Ctrl+C / X / V', 'Copy / Cut / Paste (also images, links, text)'],
                ['Ctrl+D', 'Duplicate selection'],
                ['Ctrl+A', 'Select all'],
                ['Ctrl+F', 'Search elements'],
                ['Ctrl+G', 'Group / Ungroup'],
                ['C', 'Create frame around selection'],
                ['L', 'Lock / Unlock elements'],
                ['Q', 'Align horizontal (same Y center)'],
                ['E', 'Align vertical (same X center)'],
                ['Shift+Q', 'Distribute horizontal spacing'],
                ['Shift+E', 'Distribute vertical spacing'],
                ['Delete / Backspace', 'Delete selected'],
                ['Escape', 'Back to Select tool, deselect, close panels'],
                ['[ / ]', 'Send to back / Bring to front'],
                ['?', 'Toggle this help'],
                ['Alt+Drag', 'Clone element(s)'],
                ['Alt+Q', 'Isolate / Unisolate selected'],
                ['Alt+Drag port', 'Transfer all connections from port'],
                ['Right-click', 'Insert/Remove Link on element'],
                ['Shift+Click', 'Multi-select'],
                ['Shift+Drag shape', 'Constrain proportions'],
                ['Shift+Drag pen/arrow', 'Snap to 45° angles'],
                ['Middle-click', 'Pan canvas'],
                ['Scroll wheel', 'Zoom in/out'],
                ['Double-click', 'Edit text/title'],
                ['Right-click selected', 'Context menu'],
                ['Right-click canvas', 'Pan'],
                ['Click connection', 'Cycle style (curved/straight/electric)'],
                ['Double-click conn.', 'Add reroute node (drag its side dots to branch)'],
                ['Right-click conn.', 'Toggle animation (flow/solid)'],
                ['Mid-click / Alt+click conn.', 'Cycle line color (Mac: Option+click)'],
                ['Shift+Drag canvas', 'Cut connections (knife)'],
              ].map(([key, desc]) => (
                <React.Fragment key={key}>
                  <div className={`font-mono font-bold px-1.5 py-1 rounded ${isDark ? 'bg-zinc-800 text-indigo-400' : 'bg-gray-100 text-indigo-600'}`}>{key}</div>
                  <div className="py-1 opacity-80">{desc}</div>
                </React.Fragment>
              ))}
              {isTouch && (<>
                <div className={`col-span-2 font-bold text-xs mt-3 mb-1 pt-2 border-t ${isDark ? 'border-zinc-700 text-indigo-400' : 'border-gray-200 text-indigo-600'}`}>Touch Gestures</div>
                {[
                  ['2-finger drag', 'Pan canvas'],
                  ['Pinch', 'Zoom in/out'],
                  ['Long-press selected', 'Context menu'],
                  ['Tap element', 'Select'],
                  ['Drag element', 'Move'],
                  ['Double-tap text', 'Edit'],
                  ['📷 toolbar button', 'Add image / screenshot'],
                ].map(([key, desc]) => (
                  <React.Fragment key={key}>
                    <div className={`font-mono font-bold px-1.5 py-1 rounded ${isDark ? 'bg-zinc-800 text-amber-400' : 'bg-amber-50 text-amber-600'}`}>{key}</div>
                    <div className="py-1 opacity-80">{desc}</div>
                  </React.Fragment>
                ))}
              </>)}
            </div>
          </div>
        </div>
      )}

      {/* Right-Click Context Menu */}
      {rightClickMenu && selectedIds.size > 0 && (
        <div
          className={`absolute z-[9999] w-48 rounded-xl shadow-2xl border overflow-hidden ${isDark ? 'bg-[#262320] border-zinc-700' : 'bg-white border-gray-200'}`}
          style={{ left: rightClickMenu.x, top: rightClickMenu.y }}
          onClick={() => setRightClickMenu(null)}
        >
          {[
            { icon: 'copy', label: 'Duplicate', shortcut: 'Ctrl+D', action: () => {
              takeSnapshot();
              const offset = 30;
              const newEls = elements.filter(el => selectedIds.has(el.id)).map(el => {
                const clone = JSON.parse(JSON.stringify(el));
                clone.id = generateId();
                if (clone.type === 'arrow') { clone.startX += offset; clone.startY += offset; clone.endX += offset; clone.endY += offset; }
                else { clone.x += offset; clone.y += offset; }
                if (clone.tasks) clone.tasks.forEach(t => t.id = generateId());
                return clone;
              });
              const newFrs = frames.filter(f => selectedIds.has(f.id)).map(f => {
                const clone = JSON.parse(JSON.stringify(f)); clone.id = generateId(); clone.x += offset; clone.y += offset; return clone;
              });
              setElements(els => [...els, ...newEls]);
              setFrames(fs => [...fs, ...newFrs]);
              setSelectedIds(new Set([...newEls.map(e => e.id), ...newFrs.map(f => f.id)]));
            }},
            { icon: 'layerUp', label: 'Bring to Front', shortcut: ']', action: () => {
              takeSnapshot();
              setElements(els => { const sel = els.filter(el => selectedIds.has(el.id)); const rest = els.filter(el => !selectedIds.has(el.id)); return [...rest, ...sel]; });
            }},
            { icon: 'layerDown', label: 'Send to Back', shortcut: '[', action: () => {
              takeSnapshot();
              setElements(els => { const sel = els.filter(el => selectedIds.has(el.id)); const rest = els.filter(el => !selectedIds.has(el.id)); return [...sel, ...rest]; });
            }},
            { icon: (() => { const sel = [...elements.filter(el => selectedIds.has(el.id)), ...frames.filter(f => selectedIds.has(f.id))]; return sel.some(s => s.locked) ? 'unlock' : 'lock'; })(), label: (() => { const sel = [...elements.filter(el => selectedIds.has(el.id)), ...frames.filter(f => selectedIds.has(f.id))]; return sel.some(s => s.locked) ? 'Unlock' : 'Lock'; })(), shortcut: 'L', action: () => {
              takeSnapshot();
              setElements(els => els.map(el => selectedIds.has(el.id) ? { ...el, locked: !el.locked } : el));
              setFrames(fs => fs.map(f => selectedIds.has(f.id) ? { ...f, locked: !f.locked } : f));
            }},
            // Insert/Remove Link — only for single element that supports it
            ...(selectedIds.size === 1 ? (() => {
              const sel = elements.find(el => selectedIds.has(el.id));
              if (!sel || ['card', 'arrow', 'emoji', 'link', 'sequence'].includes(sel.type)) return [];
              const hasLink = !!sel.href;
              return [
                null,
                { icon: 'external', label: hasLink ? 'Edit Link' : 'Insert Link', shortcut: '', action: () => {
                  const url = prompt('Enter URL:', sel.href || 'https://');
                  if (url !== null) {
                    takeSnapshot();
                    updateElement(sel.id, { href: url || null });
                  }
                }},
                ...(hasLink ? [
                  { icon: 'close', label: 'Remove Link', shortcut: '', action: () => {
                    takeSnapshot();
                    updateElement(sel.id, { href: null });
                  }},
                  { icon: 'type', label: 'Edit Content', shortcut: 'DblClick', action: () => {
                    if (['rect', 'circle', 'triangle', 'text'].includes(sel.type)) {
                      takeSnapshot();
                      setEditingId(sel.id);
                    }
                    setRightClickMenu(null);
                  }},
                ] : []),
              ];
            })() : []),
            ...(selectedIds.size > 1 ? [
              null, // separator
              { icon: 'alignCenter', label: 'Align Horizontal', shortcut: 'Q', action: () => {
                takeSnapshot();
                const selEls = elements.filter(el => selectedIds.has(el.id) && el.type !== 'arrow');
                const selFrs = frames.filter(f => selectedIds.has(f.id));
                let totalY = 0, count = 0;
                selEls.forEach(el => { const h = el.height === 'auto' ? getDOMHeight(el.id, getExactHeight(el)) : getExactHeight(el); totalY += el.y + h/2; count++; });
                selFrs.forEach(f => { totalY += f.y + f.height/2; count++; });
                if (!count) return;
                const avg = totalY / count;
                setElements(els => els.map(el => { if (!selectedIds.has(el.id) || el.type === 'arrow') return el; const h = el.height === 'auto' ? getDOMHeight(el.id, getExactHeight(el)) : getExactHeight(el); return { ...el, y: avg - h/2 }; }));
                setFrames(fs => fs.map(f => {
                  if (!selectedIds.has(f.id)) return f;
                  const dy = avg - (f.y + f.height/2);
                  setElements(els2 => els2.map(el => (el.x >= f.x && el.y >= f.y && el.x + (el.width === 'auto' ? 280 : el.width) <= f.x + f.width && el.y + getExactHeight(el) <= f.y + f.height && !selectedIds.has(el.id)) ? { ...el, y: el.y + dy } : el));
                  return { ...f, y: f.y + dy };
                }));
              }},
              { icon: 'alignCenter', label: 'Align Vertical', shortcut: 'E', action: () => {
                takeSnapshot();
                const selEls = elements.filter(el => selectedIds.has(el.id) && el.type !== 'arrow');
                const selFrs = frames.filter(f => selectedIds.has(f.id));
                let totalX = 0, count = 0;
                selEls.forEach(el => { const w = el.width === 'auto' ? 280 : el.width; totalX += el.x + w/2; count++; });
                selFrs.forEach(f => { totalX += f.x + f.width/2; count++; });
                if (!count) return;
                const avg = totalX / count;
                setElements(els => els.map(el => (!selectedIds.has(el.id) || el.type === 'arrow') ? el : { ...el, x: avg - (el.width === 'auto' ? 280 : el.width)/2 }));
                setFrames(fs => fs.map(f => {
                  if (!selectedIds.has(f.id)) return f;
                  const dx = avg - (f.x + f.width/2);
                  setElements(els2 => els2.map(el => (el.x >= f.x && el.y >= f.y && el.x + (el.width === 'auto' ? 280 : el.width) <= f.x + f.width && el.y + getExactHeight(el) <= f.y + f.height && !selectedIds.has(el.id)) ? { ...el, x: el.x + dx } : el));
                  return { ...f, x: f.x + dx };
                }));
              }},
            ] : []),
            null, // separator
            { icon: 'trash', label: 'Delete', shortcut: 'Del', danger: true, action: () => deleteSelection() },
          ].map((item, i) => item === null ? (
            <div key={i} className={`h-px mx-2 ${isDark ? 'bg-zinc-700' : 'bg-gray-200'}`}/>
          ) : (
            <button key={item.label} onClick={item.action} className={`w-full px-3 py-2 text-xs font-medium flex items-center gap-2.5 transition ${item.danger ? 'text-red-500 hover:bg-red-500/10' : isDark ? 'text-white hover:bg-zinc-800' : 'text-gray-800 hover:bg-gray-100'}`}>
              <Icon name={item.icon} size={14} />
              <span className="flex-1 text-left">{item.label}</span>
              <span className={`text-[10px] font-mono ${isDark ? 'text-zinc-500' : 'text-gray-400'}`}>{item.shortcut}</span>
            </button>
          ))}
        </div>
      )}

      {/* Navbar */}
      <div data-html2canvas-ignore="true" className={`flex items-center justify-between p-1.5 px-3 z-50 shadow-sm backdrop-blur-md ui-element ${isDark ? 'bg-[#262320]/90 border-b border-zinc-800' : 'bg-white/90 border-b border-gray-200'}`} style={{ paddingTop: 'calc(6px + var(--sat, 0px))' }}>
        <div className="flex items-center gap-2">
          <button onClick={handleClose} className="p-1 hover:bg-black/10 dark:hover:bg-white/10 rounded-md transition" title="Close and Save">
            <Icon name="close" size={14} />
          </button>
          <input 
            value={project.name} 
            onChange={(e) => setProject({...project, name: e.target.value})}
            className={`font-bold text-xs bg-transparent border-none outline-none focus:ring-2 rounded px-1.5 w-36 ${isDark ? 'focus:ring-indigo-500' : 'focus:ring-indigo-400'}`}
          />
        </div>
        <div className="flex items-center gap-1.5">
          {/* Undo / Redo */}
          <div className="flex items-center mr-1 border-r border-gray-500/30 pr-2">
             <button onClick={handleUndo} disabled={past.length === 0} className={`p-1 rounded-md transition ${past.length === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-black/10 dark:hover:bg-white/10'}`} title="Undo (Ctrl+Z)">
               <Icon name="undo" size={12} />
             </button>
             <button onClick={handleRedo} disabled={future.length === 0} className={`p-1 rounded-md transition ${future.length === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-black/10 dark:hover:bg-white/10'}`} title="Redo (Ctrl+Y)">
               <Icon name="redo" size={12} />
             </button>
          </div>

          {/* Time, Date, Weather */}
          <div className="flex items-center gap-3 mr-2 border-r border-gray-500/30 pr-4 text-[10px] font-semibold opacity-80 tracking-wide">
             {weather && <><span title="Local Weather">{getWeatherIcon(weather.code)} {weather.temp}°C</span><span className="opacity-50">-</span></>}
             <span>{timeInfo.time}</span>
             <span className="opacity-50">-</span>
             <span>{timeInfo.date}</span>
          </div>

          <button onClick={fitToScreen} className="p-1 hover:bg-black/10 dark:hover:bg-white/10 rounded-md transition" title="Fit to Screen">
            <Icon name="zoomFit" size={14} />
          </button>
          <span className="text-[10px] font-mono opacity-70 mr-1">{(transform.scale * 100).toFixed(0)}%</span>
          <button onClick={() => setTheme(isDark ? 'light' : 'dark')} className="p-1 hover:bg-black/10 dark:hover:bg-white/10 rounded-md transition" title="Toggle Theme">
            <Icon name={isDark ? 'sun' : 'moon'} size={14} />
          </button>
          <button onClick={() => setShowHelp(true)} className="p-1 hover:bg-black/10 dark:hover:bg-white/10 rounded-md transition" title="Keyboard Shortcuts (?)">
            <Icon name="help" size={14} />
          </button>
          
          <div className="flex items-center gap-1.5 border-r border-gray-500/30 pr-2 mr-1">
             <span className={`text-[10px] font-bold ${isUnsaved ? 'text-yellow-500' : 'opacity-50'}`}>
              {isUnsaved ? 'Unsaved' : 'Saved'}
            </span>
            {lastSaved && <span className="text-[9px] opacity-40">{lastSaved}</span>}
            {saveNotice && <span className="text-[9px] text-yellow-500 max-w-[220px] truncate" title={saveNotice}>{saveNotice}</span>}
            {!window.showSaveFilePicker && <span className="text-[9px] opacity-40" title="This browser can't save to the same file — each save downloads a new copy. Use Chrome or Edge for one-click saving.">· download mode</span>}
            {fileHandle && <span className="text-[9px] opacity-40 max-w-[100px] truncate whitespace-nowrap" title={`Saving to ${fileHandle.name}`}>· {fileHandle.name}</span>}
          </div>
          <div className="relative">
            <button onClick={() => setShowExportMenu(!showExportMenu)} className="p-1 hover:bg-black/10 dark:hover:bg-white/10 rounded-md transition" title="Export">
              <Icon name="download" size={14} />
            </button>
            {showExportMenu && (
              <div className={`absolute right-0 top-full mt-1 w-40 rounded-lg shadow-xl border flex flex-col overflow-hidden z-50 ${isDark ? 'bg-[#262320] border-zinc-700' : 'bg-white border-gray-200'}`}>
                <button onClick={() => exportAs('png')} className={`p-2 text-xs font-semibold text-left transition flex items-center gap-2 ${isDark ? 'hover:bg-zinc-800 text-white' : 'hover:bg-gray-100 text-black'}`}>
                  <span className="w-8 text-[10px] font-bold text-indigo-500">PNG</span> Transparent
                </button>
                <button onClick={() => exportAs('jpg')} className={`p-2 text-xs font-semibold text-left transition flex items-center gap-2 ${isDark ? 'hover:bg-zinc-800 text-white' : 'hover:bg-gray-100 text-black'}`}>
                  <span className="w-8 text-[10px] font-bold text-green-500">JPG</span> With background
                </button>
                <button onClick={() => exportAs('pdf')} className={`p-2 text-xs font-semibold text-left transition flex items-center gap-2 ${isDark ? 'hover:bg-zinc-800 text-white' : 'hover:bg-gray-100 text-black'}`}>
                  <span className="w-8 text-[10px] font-bold text-red-500">PDF</span> Clickable Links
                </button>
                <button onClick={() => exportAs('svg')} className={`p-2 text-xs font-semibold text-left transition flex items-center gap-2 ${isDark ? 'hover:bg-zinc-800 text-white' : 'hover:bg-gray-100 text-black'}`}>
                  <span className="w-8 text-[10px] font-bold text-purple-500">SVG</span> Vector format
                </button>
              </div>
            )}
          </div>

          <button onClick={() => saveToPC()} className="flex items-center justify-center p-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md transition shadow" title={fileHandle ? `Save to ${fileHandle.name} (Ctrl+S) · Save As: Ctrl+Shift+S` : 'Save file to PC (Ctrl+S)'}>
            <Icon name="save" size={14} />
          </button>
        </div>
      </div>

      {/* Main Area */}
      <div className="flex-1 relative flex">
        
        {/* Toolbar */}
        <div data-html2canvas-ignore="true" className={`absolute left-3 top-3 z-40 flex flex-col gap-0.5 ${isTouch ? 'p-1.5' : 'p-1'} rounded-lg shadow-xl backdrop-blur-md border ui-element ${isDark ? 'bg-[#262320]/95 border-zinc-800' : 'bg-white/95 border-gray-200'}`} style={{ paddingTop: 'calc(var(--sat, 0px) + 4px)' }}>
          {(() => {
            const btnCls = (active) => `${isTouch ? 'p-2.5' : 'p-1.5'} rounded-md flex items-center justify-center transition ${active ? 'bg-indigo-500 text-white shadow-sm' : isDark ? 'hover:bg-zinc-700 text-zinc-400 hover:text-white' : 'hover:bg-gray-100 text-gray-500 hover:text-black'}`;
            const iconSz = isTouch ? 18 : 14;
            return (<>
          <button onClick={() => {setActiveTool('select'); setShowShapeMenu(false); setShowEmojiMenu(false); }} title="Select & Move (1)" className={btnCls(activeTool === 'select')}><Icon name="cursor" size={iconSz} /></button>
          
          <div className="relative">
            <button onClick={() => { setActiveTool('shape'); setShowShapeMenu(!showShapeMenu); setShowEmojiMenu(false); }} title="Shapes (2)" className={`w-full ${btnCls(activeTool === 'shape')}`}><Icon name={subTool} size={iconSz} /></button>
            {showShapeMenu && (
              <div className={`absolute left-full ml-1 top-0 flex gap-0.5 p-1 rounded-lg shadow-xl border ${isDark ? 'bg-[#262320] border-zinc-700' : 'bg-white border-gray-200'}`}>
                {['rect', 'circle', 'triangle'].map(s => (
                  <button key={s} onClick={() => {setSubTool(s); setActiveTool('shape'); setShowShapeMenu(false);}} className={`${isTouch ? 'p-2.5' : 'p-1.5'} rounded-md ${subTool === s ? 'bg-indigo-500 text-white' : isDark ? 'hover:bg-zinc-700' : 'hover:bg-gray-100'}`}><Icon name={s} size={iconSz} /></button>
                ))}
              </div>
            )}
          </div>

          <div className="relative">
            <button onClick={() => {setActiveTool('pen'); setShowShapeMenu(false); setShowEmojiMenu(false); }} title="Pen Drawing (3)" className={`w-full ${btnCls(activeTool === 'pen')}`}><Icon name="brush" size={iconSz} /></button>
            {activeTool === 'pen' && (
              <div className={`absolute left-full ml-1 top-0 flex flex-col gap-1.5 p-2 rounded-lg shadow-xl border min-w-[120px] ${isDark ? 'bg-[#262320] border-zinc-700' : 'bg-white border-gray-200'}`}>
                <div className="grid grid-cols-7 gap-0.5">
                  {PASTEL_COLORS.map(c => (
                    <button key={c} onClick={() => setPenColor(c)} className={`${isTouch ? 'w-5 h-5' : 'w-3.5 h-3.5'} rounded-full border border-black/10 dark:border-white/20 transition-transform hover:scale-125`} style={{ backgroundColor: c, outline: penColor === c ? '2px solid #e07a5f' : 'none', outlineOffset: '1px' }} />
                  ))}
                </div>
                <div className="flex items-center gap-1 mt-0.5">
                  <span className={`text-[8px] font-bold uppercase ${isDark ? 'text-zinc-500' : 'text-gray-400'}`}>Width</span>
                  {[2, 4, 6, 8, 12].map(w => (
                    <button key={w} onClick={() => setPenWidth(w)} className={`${isTouch ? 'w-7 h-7' : 'w-5 h-5'} rounded text-[9px] font-bold transition ${penWidth === w ? 'bg-indigo-500 text-white' : isDark ? 'hover:bg-zinc-700 text-zinc-400' : 'hover:bg-gray-200 text-gray-500'}`}>{w}</button>
                  ))}
                </div>
              </div>
            )}
          </div>
          <button onClick={() => {setActiveTool('text'); setShowShapeMenu(false); setShowEmojiMenu(false); }} title="Text (4)" className={btnCls(activeTool === 'text')}><Icon name="type" size={iconSz} /></button>
          <button onClick={() => {setActiveTool('card'); setShowShapeMenu(false); setShowEmojiMenu(false); }} title="Board Card (5)" className={btnCls(activeTool === 'card')}><Icon name="list" size={iconSz} /></button>
          
          <div className="relative">
             <button onClick={() => { setActiveTool('emoji'); setShowEmojiMenu(true); setShowShapeMenu(false); }} title="Sticker (6)" className={`w-full ${btnCls(activeTool === 'emoji')}`}><Icon name="smile" size={iconSz} /></button>
             {showEmojiMenu && (
              <div className={`absolute left-full ml-1 top-0 grid grid-cols-8 gap-0.5 p-1.5 rounded-lg shadow-xl border ${isDark ? 'bg-[#262320] border-zinc-700' : 'bg-white border-gray-200'}`} style={{ width: 240 }}>
                {EMOJI_LIST.map(em => (
                  <button key={em} onClick={() => {setSelectedEmoji(em); setActiveTool('emoji'); setShowEmojiMenu(false);}} className={`text-lg p-1 rounded-md hover:bg-black/10 dark:hover:bg-white/10 flex items-center justify-center ${selectedEmoji === em ? 'bg-indigo-500/20 ring-1 ring-indigo-500' : ''}`} style={{ minWidth: 26, minHeight: 26 }}>{em}</button>
                ))}
              </div>
            )}
          </div>

          <button onClick={() => {setActiveTool('arrow'); setShowShapeMenu(false); setShowEmojiMenu(false); }} title="Arrow/Line (7)" className={btnCls(activeTool === 'arrow')}><Icon name="arrow" size={iconSz} /></button>

          <div className={`h-px w-full my-1 ${isDark ? 'bg-zinc-700' : 'bg-gray-200'}`}></div>
          
          {/* Image Upload — essential for iPad screenshots */}
          <button onClick={handleImageUpload} title="Add Image" className={btnCls(false)}><Icon name="image" size={iconSz} /></button>
          
          <button onClick={() => setSnapEnabled(!snapEnabled)} title={snapEnabled ? "Snap: On" : "Snap: Off"} className={`${isTouch ? 'p-2.5' : 'p-1.5'} rounded-md flex items-center justify-center transition text-[10px] font-bold ${snapEnabled ? 'bg-indigo-500 text-white shadow-sm' : isDark ? 'hover:bg-zinc-700 text-zinc-400 hover:text-white' : 'hover:bg-gray-100 text-gray-500 hover:text-black'}`}>
            <span style={{fontSize: isTouch ? '14px' : '10px', lineHeight: 1}}>⊞</span>
          </button>
            </>);
          })()}
        </div>

        {/* Canvas */}
        <div 
          ref={workspaceRef}
          className="flex-1 overflow-hidden relative"
          style={{ touchAction: 'none' }}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerLeave={handlePointerUp}
          onDragOver={(e) => e.preventDefault()}
          onDrop={handleWorkspaceDrop}
          onDoubleClick={(e) => {
            if (e.target.id !== 'workspace-bg') return;
            takeSnapshot();
            const rect = workspaceRef.current.getBoundingClientRect();
            let sx = (e.clientX - rect.left - transform.x) / transform.scale;
            let sy = (e.clientY - rect.top - transform.y) / transform.scale;
            if (snapEnabled) { sx = Math.round(sx / 30) * 30; sy = Math.round(sy / 30) * 30; }
            const newEl = {
              id: generateId(), type: 'text', x: sx - 120, y: sy - 30, width: 240, height: 60,
              content: '', textColor: 'default', fontSize: 18, textAlign: 'center'
            };
            setElements(els => [...els, newEl]);
            setEditingId(newEl.id);
          }}
          style={{ cursor: getCursorStyle() }}
        >
          {isExporting && (
            <div data-html2canvas-ignore="true" className="absolute inset-0 z-[200] flex items-center justify-center bg-black/50 backdrop-blur-sm">
              <div className="bg-white dark:bg-zinc-800 rounded-xl px-6 py-4 shadow-2xl flex items-center gap-3">
                <svg className="animate-spin h-5 w-5 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <span className="font-semibold text-sm">Exporting...</span>
              </div>
            </div>
          )}
          {/* Dot Grid Background */}
          <div
            id="workspace-bg"
            className="absolute inset-0 z-0"
            style={{
              backgroundColor: isDark ? '#1b1916' : '#f4f1ea',
              backgroundImage: `radial-gradient(circle, ${isDark ? '#52525b' : '#94a3b8'} 0.75px, transparent 0.75px)`,
              backgroundSize: `${30 * transform.scale}px ${30 * transform.scale}px`,
              backgroundPosition: `${transform.x}px ${transform.y}px`,
              willChange: 'background-position',
            }}
          />

          <div id="transform-layer" className="absolute inset-0 pointer-events-none z-10" style={{ transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`, transformOrigin: '0 0', willChange: 'transform' }}>
            
            {/* Context Menu (Pastel Color Palette & Delete) — works for single and multi-select */}
            {selectedIds.size >= 1 && !draggingElement && !resizingElement && !resizingFrame && !isPanning && !hideMenu && (
               (() => {
                  const selectedEls = elements.filter(e => selectedIds.has(e.id));
                  const selectedFrs = frames.filter(f => selectedIds.has(f.id));
                  const allSelected = [...selectedEls, ...selectedFrs];
                  if (allSelected.length === 0) return null;

                  // Compute bounding box center for positioning
                  let minX = Infinity, minY = Infinity, maxX = -Infinity;
                  allSelected.forEach(n => {
                    if (n.type === 'arrow') {
                        const sX = n.startX !== undefined ? n.startX : n.x + (n.relStartX || 0);
                        const sY = n.startY !== undefined ? n.startY : n.y + (n.relStartY || 0);
                        const eX = n.endX !== undefined ? n.endX : n.x + (n.relEndX || 0);
                        const eY = n.endY !== undefined ? n.endY : n.y + (n.relEndY || 0);
                        if (sX < minX) minX = sX;
                        if (eX < minX) minX = eX;
                        if (sX > maxX) maxX = sX;
                        if (eX > maxX) maxX = eX;
                        if (Math.min(sY, eY) < minY) minY = Math.min(sY, eY);
                    } else {
                        const w = n.width === 'auto' ? 280 : n.width;
                        if (n.x < minX) minX = n.x;
                        if (n.y < minY) minY = n.y;
                        if (n.x + w > maxX) maxX = n.x + w;
                    }
                  });
                  const centerX = (minX + maxX) / 2;

                  const isSingle = allSelected.length === 1;
                  const el = isSingle ? allSelected[0] : null;
                  const isText = isSingle && el.type === 'text';
                  const hasColor = isSingle ? !['image', 'emoji', 'link', 'sequence'].includes(el.type) : true;
                  const hasFontSize = isSingle && ['rect', 'circle', 'triangle', 'text'].includes(el.type);
                  const hasTextAlign = isSingle && ['rect', 'circle', 'triangle', 'text'].includes(el.type);
                  const hasLocked = allSelected.some(s => s.locked);

                  return (
                     <div
                        data-html2canvas-ignore="true" className={`absolute pointer-events-auto flex flex-col p-2 rounded-xl shadow-2xl border backdrop-blur-md ui-element z-[100] min-w-max ${isDark ? 'bg-[#262320]/95 border-zinc-700' : 'bg-white/95 border-gray-200'}`}
                        style={{ left: centerX, top: minY - 12, transform: 'translate(-50%, -100%)' }}
                        onPointerDown={e => e.stopPropagation()}
                     >
                        {hasColor && (
                           <div className="grid grid-cols-7 gap-1 mb-1.5">
                              {PASTEL_COLORS.map(c => {
                                 const isActive = isSingle && (isText ? (el.textColor==='default' ? getContrastText(el.color) === c : el.textColor === c) : el.color === c);
                                 return (
                                    <button
                                       key={c}
                                       onClick={() => {
                                          takeSnapshot();
                                          selectedIds.forEach(id => {
                                            const isFrame = frames.find(f => f.id === id);
                                            if (isFrame) updateFrame(id, { color: c });
                                            else {
                                              const elem = elements.find(e => e.id === id);
                                              if (elem && elem.type === 'text') updateElement(id, { textColor: c });
                                              else if (elem) updateElement(id, { color: c });
                                            }
                                          });
                                       }}
                                       className="w-4 h-4 rounded-full border border-black/10 dark:border-white/20 transition-transform hover:scale-125"
                                       style={{ backgroundColor: c, outline: isActive ? '2px solid #e07a5f' : 'none', outlineOffset: '2px' }}
                                       title="Change Color"
                                    />
                                 )
                              })}
                           </div>
                        )}
                        {hasFontSize && el && (
                           <div className="border-t border-black/10 dark:border-white/10 pt-1.5 mt-0.5">
                              <div className="flex items-center gap-1">
                                 <span className={`text-[9px] font-semibold uppercase tracking-wider ${isDark ? 'text-zinc-500' : 'text-gray-400'}`}>Size</span>
                                 <div className="flex gap-0.5">
                                    {[14, 18, 24, 32, 48, 64].map(s => (
                                       <button
                                          key={s}
                                          onClick={() => { takeSnapshot(); updateElement(el.id, { fontSize: s }); }}
                                          className={`w-6 h-5 rounded text-[9px] font-bold transition ${(el.fontSize || 18) === s ? 'bg-indigo-500 text-white' : isDark ? 'hover:bg-zinc-700 text-zinc-400' : 'hover:bg-gray-200 text-gray-500'}`}
                                       >
                                          {s}
                                       </button>
                                    ))}
                                 </div>
                              </div>
                           </div>
                        )}
                        {isSingle && el && !['emoji', 'link', 'draw', 'arrow', 'text', 'sequence'].includes(el.type) && (
                           <div className="border-t border-black/10 dark:border-white/10 pt-1.5 mt-0.5">
                              <div className="flex items-center gap-1.5 mb-1">
                                 <span className={`text-[9px] font-semibold uppercase tracking-wider ${isDark ? 'text-zinc-500' : 'text-gray-400'}`}>Stroke</span>
                                 <div className="flex gap-0.5">
                                    {['transparent', '#000000', '#ffffff', '#e07a5f', '#ef4444', '#22c55e', '#f59e0b'].map(sc => (
                                       <button
                                          key={sc}
                                          onClick={() => { takeSnapshot(); updateElement(el.id, { strokeColor: sc }); }}
                                          className="w-3.5 h-3.5 rounded-full border transition-transform hover:scale-125"
                                          style={{
                                             backgroundColor: sc === 'transparent' ? 'transparent' : sc,
                                             borderColor: sc === 'transparent' ? (isDark ? '#555' : '#ccc') : sc === '#ffffff' ? '#ccc' : sc,
                                             backgroundImage: sc === 'transparent' ? `linear-gradient(45deg, transparent 45%, #ef4444 45%, #ef4444 55%, transparent 55%)` : 'none',
                                             outline: el.strokeColor === sc ? '2px solid #e07a5f' : 'none',
                                             outlineOffset: '1px'
                                          }}
                                          title={sc === 'transparent' ? 'No stroke' : sc}
                                       />
                                    ))}
                                 </div>
                              </div>
                              <div className="flex items-center gap-1">
                                 <span className={`text-[9px] font-semibold uppercase tracking-wider ${isDark ? 'text-zinc-500' : 'text-gray-400'}`}>Width</span>
                                 <div className="flex gap-0.5">
                                    {[1, 2, 3, 4, 6].map(w => (
                                       <button
                                          key={w}
                                          onClick={() => { takeSnapshot(); updateElement(el.id, { strokeWidth: w }); }}
                                          className={`w-5 h-5 rounded text-[9px] font-bold transition ${el.strokeWidth === w ? 'bg-indigo-500 text-white' : isDark ? 'hover:bg-zinc-700 text-zinc-400' : 'hover:bg-gray-200 text-gray-500'}`}
                                       >
                                          {w}
                                       </button>
                                    ))}
                                 </div>
                              </div>
                           </div>
                        )}
                        <div className={`flex items-center justify-between ${hasColor ? 'border-t border-black/10 dark:border-white/10 pt-1' : ''}`}>
                           <div className="flex items-center gap-0.5">
                             {hasTextAlign && el && (
                               <>
                                 {['left', 'center', 'right'].map(align => (
                                   <button key={align} onClick={() => { takeSnapshot(); updateElement(el.id, { textAlign: align }); }}
                                     className={`p-1 rounded-md transition ${(el.textAlign || 'center') === align ? 'bg-indigo-500 text-white' : isDark ? 'hover:bg-zinc-700 text-zinc-400' : 'hover:bg-gray-200 text-gray-500'}`}
                                     title={`Align ${align}`}>
                                     <Icon name={`align${align.charAt(0).toUpperCase() + align.slice(1)}`} size={12} />
                                   </button>
                                 ))}
                                 <div className={`w-px h-4 mx-0.5 ${isDark ? 'bg-zinc-700' : 'bg-gray-200'}`}/>
                               </>
                             )}
                             <button onClick={() => {
                               takeSnapshot();
                               setElements(els => { const sel = els.filter(e => selectedIds.has(e.id)); const rest = els.filter(e => !selectedIds.has(e.id)); return [...rest, ...sel]; });
                             }} className={`p-1 rounded-md transition ${isDark ? 'hover:bg-zinc-700 text-zinc-400' : 'hover:bg-gray-200 text-gray-500'}`} title="Bring to Front (])">
                               <Icon name="layerUp" size={12} />
                             </button>
                             <button onClick={() => {
                               takeSnapshot();
                               setElements(els => { const sel = els.filter(e => selectedIds.has(e.id)); const rest = els.filter(e => !selectedIds.has(e.id)); return [...sel, ...rest]; });
                             }} className={`p-1 rounded-md transition ${isDark ? 'hover:bg-zinc-700 text-zinc-400' : 'hover:bg-gray-200 text-gray-500'}`} title="Send to Back ([)">
                               <Icon name="layerDown" size={12} />
                             </button>
                             <button onClick={() => {
                               takeSnapshot();
                               selectedIds.forEach(id => {
                                 const isFrame = frames.find(f => f.id === id);
                                 if (isFrame) updateFrame(id, { locked: !isFrame.locked });
                                 else {
                                   const elem = elements.find(e => e.id === id);
                                   if (elem) updateElement(id, { locked: !elem.locked });
                                 }
                               });
                             }} className={`p-1 rounded-md transition ${hasLocked ? 'bg-yellow-500/20 text-yellow-600' : isDark ? 'hover:bg-zinc-700 text-zinc-400' : 'hover:bg-gray-200 text-gray-500'}`} title="Lock/Unlock (L)">
                               <Icon name={hasLocked ? "lock" : "unlock"} size={12} />
                             </button>
                           </div>
                           <button onClick={() => deleteSelection()} className="p-1 hover:bg-red-500/20 text-red-500 rounded-md transition"><Icon name="trash" size={14}/></button>
                        </div>
                     </div>
                  );
               })()
            )}

            {/* Draw Preview Box */}
            {drawingAction && activeTool !== 'pen' && drawingAction.type === 'arrow' && (
              <svg xmlns="http://www.w3.org/2000/svg" className="absolute inset-0 overflow-visible pointer-events-none z-50">
                <line x1={drawingAction.startX} y1={drawingAction.startY} x2={drawingAction.currentX} y2={drawingAction.currentY} stroke="#e07a5f" strokeWidth="3" strokeDasharray="5 5" />
              </svg>
            )}
            {drawingAction && activeTool !== 'pen' && drawingAction.type !== 'arrow' && (
              <div
                className="absolute border-2 border-indigo-500 border-dashed bg-indigo-500/10 pointer-events-none rounded-xl z-50"
                style={{
                  left: Math.min(drawingAction.startX, drawingAction.currentX),
                  top: Math.min(drawingAction.startY, drawingAction.currentY),
                  width: Math.abs(drawingAction.currentX - drawingAction.startX),
                  height: Math.abs(drawingAction.currentY - drawingAction.startY),
                  borderRadius: drawingAction.type === 'circle' ? '50%' : '12px'
                }}
              />
            )}

            {/* Freehand Draw Preview */}
            {currentPath && (
               <svg xmlns="http://www.w3.org/2000/svg" className="absolute inset-0 overflow-visible pointer-events-none z-50">
                  <path 
                     d={`M ${currentPath.points.map(p => `${p.x},${p.y}`).join(' L ')}`} 
                     stroke={currentPath.color} strokeWidth={currentPath.width} fill="none" strokeLinecap="round" strokeLinejoin="round" 
                  />
               </svg>
            )}

            {/* Frames (Unreal Engine Grouping) */}
            {frames.map(frame => (
              <div
                key={frame.id}
                data-frame-id={frame.id}
                className={`absolute border-2 rounded-3xl group/frame ${activeTool !== 'select' ? 'pointer-events-none' : 'pointer-events-auto'} ${isolatedIds && !isolatedIds.has(frame.id) ? 'opacity-10 pointer-events-none' : ''}`}
                style={{
                  left: frame.x, top: frame.y, width: frame.width, height: frame.height,
                  backgroundColor: frame.color === 'rgba(99, 102, 241, 0.1)' || frame.color === 'rgba(255, 255, 255, 0.05)' || frame.color === 'rgba(0, 0, 0, 0.05)' ? frame.color : `${frame.color}33`, 
                  borderColor: frame.color === 'rgba(99, 102, 241, 0.1)' || frame.color === 'rgba(255, 255, 255, 0.05)' || frame.color === 'rgba(0, 0, 0, 0.05)' ? '#e07a5f' : frame.color,
                  boxShadow: selectedIds.has(frame.id) ? '0 0 0 3px #e07a5f' : 'none'
                }}
                onPointerDown={(e) => handleDragStart(e, frame, true)}
                onContextMenu={(e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  if (selectedIds.has(frame.id)) {
                    setRightClickMenu({ x: e.clientX, y: e.clientY });
                  }
                }}
              >
                <div 
                  className="absolute top-0 left-0 w-full h-10 rounded-t-3xl flex items-center px-4 backdrop-blur-sm cursor-grab active:cursor-grabbing border-b border-white/20" 
                  style={{ backgroundColor: frame.color === 'rgba(99, 102, 241, 0.1)' || frame.color === 'rgba(255, 255, 255, 0.05)' || frame.color === 'rgba(0, 0, 0, 0.05)' ? '#e07a5f88' : `${frame.color}aa` }}
                  onPointerDown={(e) => handleDragStart(e, frame, true)}
                  onDoubleClick={(e) => { e.stopPropagation(); takeSnapshot(); setEditingId(frame.id); }}
                >
                  {editingId === frame.id ? (
                     <input
                        autoFocus
                        className="bg-black/20 border-none outline-none font-bold text-white w-full rounded px-1"
                        value={frame.title}
                        onChange={(e) => setFrames(fs => fs.map(f => f.id === frame.id ? { ...f, title: e.target.value } : f))}
                        onMouseDown={e => e.stopPropagation()}
                        onPointerDown={e => e.stopPropagation()}
                        draggable={false}
                        onBlur={() => setEditingId(null)}
                     />
                  ) : (
                     <div className="font-bold text-white pointer-events-none select-none">{frame.title}</div>
                  )}
                </div>

                {/* Frame Connection Nodes */}
                {['top', 'bottom', 'left', 'right'].map(port => {
                    const isConnectingStart = connectingStart?.nodeId === frame.id && connectingStart?.port === port;
                    const isHoveredTarget = connectingStart && hoveredPort?.nodeId === frame.id && hoveredPort?.port === port;
                    const activeNodeClass = (isConnectingStart || isHoveredTarget) ? 'scale-150 bg-white border-indigo-500 opacity-100' : 'bg-indigo-500 border-white dark:border-zinc-900 opacity-0 group-hover/frame:opacity-100 hover:scale-150';
                    return (
                        <div
                          key={port}
                          onPointerDown={startConnection(frame.id, port)}
                          onPointerUp={completeConnection(frame.id, port)}
                          onPointerEnter={() => setHoveredPort({ nodeId: frame.id, port })}
                          onPointerLeave={() => setHoveredPort(null)}
                          className={`absolute w-4 h-4 rounded-full border-2 transition-colors transition-transform transition-opacity z-50 cursor-crosshair ${activeNodeClass}`}
                          style={{
                            top: port === 'top' ? -8 : port === 'bottom' ? 'auto' : '50%',
                            bottom: port === 'bottom' ? -8 : 'auto',
                            left: port === 'left' ? -8 : port === 'right' ? 'auto' : '50%',
                            right: port === 'right' ? -8 : 'auto',
                            transform: (port === 'top' || port === 'bottom') ? 'translateX(-50%)' : 'translateY(-50%)'
                          }}
                        />
                    );
                })}
                  
                {/* Frame Resize Handle */}
                {!frame.locked && (
                <div 
                  className="absolute bottom-0 right-0 w-6 h-6 cursor-se-resize z-50 opacity-0 group-hover/frame:opacity-100 flex items-center justify-center bg-black/5 dark:bg-white/5 rounded-tl-lg"
                  onPointerDown={(e) => {
                    e.stopPropagation();
                    takeSnapshot();
                    setResizingFrame({ id: frame.id, startW: frame.width, startH: frame.height, startX: e.clientX, startY: e.clientY });
                  }}
                >
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" className="w-4 h-4 text-black/40 dark:text-white/40" fill="none" stroke="currentColor" strokeWidth="3"><path d="M21 15l-6 6M21 8l-13 13M21 1l-20 20"/></svg>
                </div>
                )}
                {frame.locked && (
                  <div className="absolute -top-2 -right-2 z-50 bg-yellow-500 text-white rounded-full w-5 h-5 flex items-center justify-center shadow-md pointer-events-none"><Icon name="lock" size={10} /></div>
                )}
              </div>
            ))}

            {/* Connections layer */}
            <svg id="connection-svg" xmlns="http://www.w3.org/2000/svg" className="absolute inset-0 w-full h-full overflow-visible pointer-events-none z-20">
              <style>{`@keyframes flow { to { stroke-dashoffset: -14; } }`}</style>
              
              {connections.map(conn => {
                let p1 = getPortCoords(conn.fromId, conn.fromPort);
                let p2 = getPortCoords(conn.toId, conn.toPort);
                if (!p1 || !p2) return null;
                // Alt+drag transfer: the grabbed end follows the cursor live (UE style)
                const xfer = transferringConnections && transferringConnections.conns.find(tc => tc.id === conn.id);
                let port1 = conn.fromPort, port2 = conn.toPort;
                if (xfer && tempConnectionEnd) {
                  if (xfer.side === 'from') { p1 = tempConnectionEnd; port1 = 'none'; }
                  else { p2 = tempConnectionEnd; port2 = 'none'; }
                }
                const d = generatePath(p1, p2, conn.style, port1, port2);
                
                return (
                  <g 
                    key={conn.id} 
                    className="pointer-events-auto cursor-pointer"
                    style={{ opacity: isolatedIds ? 0.1 : 1, transition: 'opacity 0.2s' }}
                    onClick={(e) => {
                      // Option/Alt+click = cycle color (Mac has no middle mouse button)
                      if (e.altKey) {
                        clearTimeout(connClickTimer.current);
                        takeSnapshot();
                        setConnections(cs => cs.map(cn => cn.id === conn.id ? { ...cn, color: PASTEL_COLORS[(PASTEL_COLORS.indexOf(cn.color) + 1) % PASTEL_COLORS.length] } : cn));
                        return;
                      }
                      if (e.detail > 1) return; // part of a double-click
                      clearTimeout(connClickTimer.current);
                      connClickTimer.current = setTimeout(() => {
                        takeSnapshot();
                        setConnections(cs => cs.map(c => c.id === conn.id ? { ...c, style: ['curved', 'straight', 'electric'][(['curved', 'straight', 'electric'].indexOf(c.style) + 1) % 3] } : c));
                      }, 220);
                    }}
                    onDoubleClick={(e) => {
                      e.stopPropagation();
                      if (e.altKey) return; // fast Option+clicks only change color
                      clearTimeout(connClickTimer.current);
                      insertReroute(conn, e);
                    }}
                    onContextMenu={(e) => { 
                      e.preventDefault(); e.stopPropagation();
                      takeSnapshot();
                      setConnections(cs => cs.map(c => c.id === conn.id ? { ...c, animated: !c.animated } : c));
                    }}
                    onMouseDown={(e) => e.preventDefault()} 
                    onAuxClick={(e) => {
                      e.preventDefault(); e.stopPropagation();
                      if (e.button === 1) {
                         takeSnapshot();
                         setConnections(cs => cs.map(cn => cn.id === conn.id ? { ...cn, color: PASTEL_COLORS[(PASTEL_COLORS.indexOf(cn.color) + 1) % PASTEL_COLORS.length] } : cn));
                      }
                    }}
                  >
                    <path data-conn-id={conn.id} d={d} stroke="transparent" strokeWidth="15" fill="none" />
                    <path data-conn-id={conn.id} d={d} stroke={xfer ? "#f59e0b" : conn.color} strokeWidth={conn.thickness} fill="none" strokeDasharray={xfer ? "8 4" : (conn.animated ? "8 6" : "none")} style={conn.animated && !xfer ? { animation: 'flow 1.0s linear infinite' } : {}} />
                    <circle data-conn-dot={conn.id} cx={p2.x} cy={p2.y} r="4" fill={xfer ? "#f59e0b" : conn.color} />
                  </g>
                );
              })}

              {cutLine && cutLine.points.length > 1 && (
                <polyline points={cutLine.points.map(p => p.x + ',' + p.y).join(' ')} fill="none" stroke="#ef4444" strokeWidth="2.5" strokeDasharray="7 5" opacity="0.9" />
              )}
              {connectingStart && tempConnectionEnd && !transferringConnections && (
                <path
                  d={generatePath(getPortCoords(connectingStart.nodeId, connectingStart.port), tempConnectionEnd, 'curved', connectingStart.port, 'none')}
                  stroke={transferringConnections ? "#f59e0b" : "#e07a5f"} strokeWidth={transferringConnections ? 3 : 5} fill="none" strokeDasharray={transferringConnections ? "8 4" : "5 5"} opacity="0.7"
                />
              )}
              

              {/* ARROWS RENDERING LAYER */}
              {elements.filter(el => el.type === 'arrow').map(el => {
                 const sX = el.startX !== undefined ? el.startX : el.x + (el.relStartX || 0);
                 const sY = el.startY !== undefined ? el.startY : el.y + (el.relStartY || 0);
                 const eX = el.endX !== undefined ? el.endX : el.x + (el.relEndX || 0);
                 const eY = el.endY !== undefined ? el.endY : el.y + (el.relEndY || 0);
                 const isSelected = selectedIds.has(el.id);
                 
                 return (
                   <g key={el.id} className={`${activeTool === 'select' ? 'pointer-events-auto cursor-pointer' : 'pointer-events-none'}`} onPointerDown={(e) => handleDragStart(e, el, false)} onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); if (selectedIds.has(el.id)) setRightClickMenu({ x: e.clientX, y: e.clientY }); }}>
                      <defs>
                        <marker id={`arrowhead-${el.id}`} markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                          <polygon points="0 0, 10 3.5, 0 7" fill={el.color} />
                        </marker>
                      </defs>
                      <line x1={sX} y1={sY} x2={eX} y2={eY} stroke="transparent" strokeWidth="20" />
                      <line x1={sX} y1={sY} x2={eX} y2={eY} stroke={el.color} strokeWidth={el.strokeWidth || 3} markerEnd={`url(#arrowhead-${el.id})`} pointerEvents="none" />
                      
                      {isSelected && (
                         <>
                           <circle cx={sX} cy={sY} r="6" fill="#ffffff" stroke="#e07a5f" strokeWidth="2" cursor="crosshair"
                              onPointerDown={e => {
                                 e.stopPropagation();
                                 setHideMenu(true);
                                 const rect = workspaceRef.current.getBoundingClientRect();
                                 const mX = (e.clientX - rect.left - transform.x) / transform.scale;
                                 const mY = (e.clientY - rect.top - transform.y) / transform.scale;
                                 setDraggingArrowNode({ id: el.id, node: 'start', startMouseX: mX, startMouseY: mY, startRelX: sX, startRelY: sY });
                              }} 
                           />
                           <circle cx={eX} cy={eY} r="6" fill="#ffffff" stroke="#e07a5f" strokeWidth="2" cursor="crosshair"
                              onPointerDown={e => {
                                 e.stopPropagation();
                                 setHideMenu(true);
                                 const rect = workspaceRef.current.getBoundingClientRect();
                                 const mX = (e.clientX - rect.left - transform.x) / transform.scale;
                                 const mY = (e.clientY - rect.top - transform.y) / transform.scale;
                                 setDraggingArrowNode({ id: el.id, node: 'end', startMouseX: mX, startMouseY: mY, startRelX: eX, startRelY: eY });
                              }} 
                           />
                         </>
                      )}
                   </g>
                 );
              })}
            </svg>

            {/* Elements Layer */}
            <div className="absolute inset-0 pointer-events-none z-30">
              {elements.map(el => {
                if (el.type === 'arrow') return null; 
                
                return (
                <div
                  key={el.id}
                  data-element-id={el.id}
                  className={`absolute group ${selectedIds.has(el.id) ? 'ring-2 ring-indigo-500 ring-offset-2 dark:ring-offset-[#1b1916] rounded-2xl' : searchMatches.includes(el.id) ? 'ring-2 ring-yellow-400 ring-offset-2 dark:ring-offset-[#1b1916] rounded-2xl' : ''} ${activeTool !== 'select' ? 'pointer-events-none' : 'pointer-events-auto'} ${['card', 'text', 'link'].includes(el.type) ? 'cursor-grab active:cursor-grabbing' : ''} ${isolatedIds && !isolatedIds.has(el.id) ? 'opacity-10 pointer-events-none' : ''}`}
                  style={{
                    left: el.x, top: el.y, width: el.width, height: el.height,
                    cursor: activeTool !== 'select' ? 'crosshair' : draggingElement?.id === el.id ? 'grabbing' : ['card', 'text', 'link'].includes(el.type) ? 'inherit' : 'grab'
                  }}
                  onPointerDown={(e) => handleDragStart(e, el, false)}
                  onContextMenu={(e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (selectedIds.has(el.id)) {
                      setRightClickMenu({ x: e.clientX, y: e.clientY });
                    }
                  }}
                  onDoubleClick={(e) => {
                     e.stopPropagation();
                     if (el.href) {
                        // Linked element — open the URL
                        openLinkSafely(el.href);
                        return;
                     }
                     if (['rect', 'circle', 'triangle', 'text'].includes(el.type)) {
                        takeSnapshot();
                        setEditingId(el.id);
                     }
                  }}
                >
                  {/* Connection Nodes */}
                  {!el.locked && el.type !== 'reroute' && ['top', 'bottom', 'left', 'right'].map(port => {
                     const isConnectingStart = connectingStart?.nodeId === el.id && connectingStart?.port === port;
                     const isHoveredTarget = connectingStart && hoveredPort?.nodeId === el.id && hoveredPort?.port === port;
                     const activeNodeClass = (isConnectingStart || isHoveredTarget) ? 'scale-150 bg-white border-indigo-500 opacity-100' : 'bg-indigo-500 border-white dark:border-zinc-900 opacity-0 group-hover:opacity-100 hover:scale-150';
                     
                     let topPos = 'auto', bottomPos = 'auto', leftPos = 'auto', rightPos = 'auto', trans = '';
                     
                     if (port === 'top') { topPos = -8; leftPos = '50%'; trans = 'translateX(-50%)'; }
                     if (port === 'bottom') { bottomPos = -8; leftPos = '50%'; trans = 'translateX(-50%)'; }
                     if (port === 'left') { leftPos = -8; topPos = '50%'; trans = 'translateY(-50%)'; }
                     if (port === 'right') { rightPos = -8; topPos = '50%'; trans = 'translateY(-50%)'; }

                     if (el.type === 'card') {
                        if (port === 'left') { topPos = '50%'; trans = 'translateY(-50%)'; }
                        if (port === 'right') { topPos = '50%'; trans = 'translateY(-50%)'; }
                     }

                     return (
                        <div
                          key={port}
                          onPointerDown={startConnection(el.id, port)}
                          onPointerUp={completeConnection(el.id, port)}
                          onPointerEnter={() => setHoveredPort({ nodeId: el.id, port })}
                          onPointerLeave={() => setHoveredPort(null)}
                          className={`absolute w-4 h-4 rounded-full border-2 transition-colors transition-transform transition-opacity z-50 cursor-crosshair ${activeNodeClass}`}
                          style={{ top: topPos, bottom: bottomPos, left: leftPos, right: rightPos, transform: trans }}
                        />
                     );
                  })}

                  {/* Task output ports on the card frame (drag-safe) */}
                  {el.type === 'card' && activeTool === 'select' && !el.locked && (
                     <CardTaskPorts el={el} connectingStart={connectingStart} hoveredPort={hoveredPort} setHoveredPort={setHoveredPort} startConnection={startConnection} completeConnection={completeConnection} />
                  )}

                  {/* Universal Resize Handle */}
                  {!['link', 'sequence', 'reroute'].includes(el.type) && !el.locked && (
                     <div 
                       className="absolute bottom-0 right-0 w-6 h-6 cursor-se-resize z-50 opacity-0 group-hover:opacity-100 flex items-center justify-center bg-black/5 dark:bg-white/5 rounded-tl-lg"
                       onPointerDown={(e) => {
                         e.stopPropagation();
                         takeSnapshot();
                         setResizingElement({ id: el.id, startW: el.width === 'auto' ? 280 : el.width, startH: getExactHeight(el), startX: e.clientX, startY: e.clientY });
                       }}
                     >
                       <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" className="w-4 h-4 text-black/40 dark:text-white/40" fill="none" stroke="currentColor" strokeWidth="3"><path d="M21 15l-6 6M21 8l-13 13M21 1l-20 20"/></svg>
                     </div>
                  )}

                  {/* Lock Indicator Badge */}
                  {el.locked && (
                    <div className="absolute -top-2 -right-2 z-50 bg-yellow-500 text-white rounded-full w-5 h-5 flex items-center justify-center shadow-md pointer-events-none"><Icon name="lock" size={10} /></div>
                  )}
                  
                  {/* Link Badge */}
                  {el.href && !el.locked && (
                    <div className="absolute -top-2 -left-2 z-50 bg-blue-500 text-white rounded-full w-5 h-5 flex items-center justify-center shadow-md pointer-events-none">
                      <Icon name="external" size={10} />
                    </div>
                  )}

                  {/* REROUTE NODE (UE-style knot) */}
                  {el.type === 'reroute' && (<>
                    <div className="absolute rounded-full shadow-md pointer-events-none" style={{ left: '50%', top: '50%', width: 18, height: 18, transform: 'translate(-50%, -50%)', backgroundColor: el.color || '#e07a5f', border: `3px solid ${isDark ? '#f4f1ea' : '#1b1916'}` }} />
                    {!el.locked && ['left', 'right'].map(port => {
                      const active = (connectingStart?.nodeId === el.id && connectingStart?.port === port) || (connectingStart && hoveredPort?.nodeId === el.id && hoveredPort?.port === port);
                      return (
                        <div
                          key={port}
                          onPointerDown={startConnection(el.id, port)}
                          onPointerUp={completeConnection(el.id, port)}
                          onPointerEnter={() => setHoveredPort({ nodeId: el.id, port })}
                          onPointerLeave={() => setHoveredPort(null)}
                          title="Drag to branch a new wire"
                          className={`absolute w-3 h-3 rounded-full border-2 z-50 cursor-crosshair transition-opacity ${active ? 'opacity-100 scale-150 bg-white border-indigo-500' : 'bg-indigo-500 border-white dark:border-zinc-900 opacity-0 group-hover:opacity-100 hover:scale-150'}`}
                          style={{ top: '50%', [port]: -10, transform: 'translateY(-50%)' }}
                        />
                      );
                    })}
                  </>)}

                  {/* SHAPES */}
                  {el.type === 'rect' && (
                    <div className="w-full h-full rounded-2xl shadow-sm flex items-center justify-center p-4 transition-colors overflow-hidden" 
                         style={{ backgroundColor: el.color, color: el.textColor === 'default' ? getContrastText(el.color) : el.textColor, border: el.strokeColor && el.strokeColor !== 'transparent' ? `${el.strokeWidth || 2}px solid ${el.strokeColor}` : '1px solid rgba(0,0,0,0.1)' }}>
                       {editingId === el.id ? (
                          <textarea autoFocus className="bg-transparent outline-none w-full h-full resize-none leading-tight font-bold" style={{ fontSize: (el.fontSize || 18) + 'px', textAlign: el.textAlign || 'center' }} value={el.content} onChange={e => updateElement(el.id, {content: e.target.value})} onMouseDown={e => e.stopPropagation()} onPointerDown={e => e.stopPropagation()} draggable={false} onBlur={() => setEditingId(null)} />
                       ) : (
                          <div className="pointer-events-none break-words w-full leading-tight font-bold" style={{ fontSize: (el.fontSize || 18) + 'px', textAlign: el.textAlign || 'center', whiteSpace: 'pre-wrap' }}>{el.content}</div>
                       )}
                    </div>
                  )}
                  {el.type === 'circle' && (
                    <div className="w-full h-full rounded-full shadow-sm flex items-center justify-center p-6 transition-colors overflow-hidden" 
                         style={{ backgroundColor: el.color, color: el.textColor === 'default' ? getContrastText(el.color) : el.textColor, border: el.strokeColor && el.strokeColor !== 'transparent' ? `${el.strokeWidth || 2}px solid ${el.strokeColor}` : '1px solid rgba(0,0,0,0.1)' }}>
                       {editingId === el.id ? (
                          <textarea autoFocus className="bg-transparent outline-none w-full h-full resize-none leading-tight font-bold" style={{ fontSize: (el.fontSize || 18) + 'px', textAlign: el.textAlign || 'center' }} value={el.content} onChange={e => updateElement(el.id, {content: e.target.value})} onMouseDown={e => e.stopPropagation()} onPointerDown={e => e.stopPropagation()} draggable={false} onBlur={() => setEditingId(null)} />
                       ) : (
                          <div className="pointer-events-none break-words w-full leading-tight font-bold" style={{ fontSize: (el.fontSize || 18) + 'px', textAlign: el.textAlign || 'center', whiteSpace: 'pre-wrap' }}>{el.content}</div>
                       )}
                    </div>
                  )}
                  {el.type === 'triangle' && (
                    <div className="w-full h-full relative" style={{ color: el.textColor === 'default' ? getContrastText(el.color) : el.textColor }}>
                       <svg xmlns="http://www.w3.org/2000/svg" className="absolute inset-0 w-full h-full drop-shadow-sm" preserveAspectRatio="none" viewBox="0 0 100 100">
                          <polygon points="50,0 100,100 0,100" fill={el.color} />
                       </svg>
                       <div className="absolute inset-0 flex items-end pb-8 justify-center px-6 overflow-hidden">
                           {editingId === el.id ? (
                             <textarea autoFocus className="bg-transparent outline-none w-full h-1/2 resize-none text-center leading-tight font-bold" style={{ fontSize: (el.fontSize || 18) + 'px' }} value={el.content} onChange={e => updateElement(el.id, {content: e.target.value})} onMouseDown={e => e.stopPropagation()} onPointerDown={e => e.stopPropagation()} draggable={false} onBlur={() => setEditingId(null)} />
                           ) : (
